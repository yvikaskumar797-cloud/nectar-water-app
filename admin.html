<!DOCTYPE html>

<html lang="hi">
<head>

<title>Nectar Water - Admin Panel</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    color:#1e293b;
}

button,a{
    font-family:inherit;
}

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(135deg,#4776f5,#764ba2);
}

.login-box{
    width:100%;
    max-width:400px;
    background:#fff;
    padding:30px;
    border-radius:22px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{

}

.login-box h1{

}

.login-box p{

}

label{

    margin-top:14px;
}

input{

button{

}

.login-btn{

}

.message{

.error{

}

#adminPage{

.header{

}

.header-inner{

    margin:auto;
    display:flex;
    align-items:center;

}

.header h1{

}

.admin-email{
    margin-top:5px;

}

.logout{
    background:white;
    color:#4776f5;

}

.container{

    margin:auto;

.filter-box{

}

.filter-item{

.filter-item label{

.refresh{

    color:white;

}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:white;
    padding:20px;
    border-radius:16px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.stat-title{
    color:#64748b;
    font-size:14px;
}

.stat-value{
    font-size:28px;
    font-weight:bold;
    margin-top:8px;
}

.limit{
    color:#4776f5;
}

.orders{
    display:grid;
    gap:15px;
}

.order{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.order-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.order-number{
    font-size:18px;
    font-weight:bold;
}

.status{
    padding:7px 12px;
    border-radius:20px;

    font-weight:bold;
}

.pending{
    background:#fef3c7;
    color:#92400e;
}

.delivered{
    background:#dcfce7;
    color:#166534;
}

.cancelled{
    background:#fee2e2;
    color:#b91c1c;
}

.order-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.detail{
    background:#f8fafc;
    padding:10px;
    border-radius:8px;
    word-break:break-word;
}

.detail b{
    display:block;
    margin-bottom:4px;
}

.actions{
    margin-top:15px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.action-btn{
    padding:10px 14px;
    border-radius:8px;
    color:white;
    font-weight:bold;
    text-decoration:none;
}

.call-btn{
    background:#1683d8;
}

.whatsapp-btn{
    background:#25D366;
}

.deliver-btn{
    background:#16a34a;
}

.pending-btn{
    background:#f59e0b;
}

.cancel-btn{
    background:#dc2626;
}

.empty{
    background:white;
    padding:35px;
    text-align:center;
    border-radius:16px;
    color:#64748b;
}

.loading{
    text-align:center;
    padding:25px;
    color:#64748b;
}

.notice{
    background:#fff7ed;
    color:#9a3412;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;

}

@media(max-width:700px){

    .cards{
        grid-template-columns:1fr;
    }

    .filter-row{
        flex-direction:column;
        align-items:stretch;
    }

    .order-grid{
        grid-template-columns:1fr;
    }

    .header-inner{
        align-items:flex-start;
    }

}
</style>

</head>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    doc,
    updateDoc,
    getDoc,
    runTransaction
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey:
    "AIzaSyC3qW2tnclJO65ziiptBAWxzifPoSLcKTw",

    authDomain:
    "nectar-water-e42b4.firebaseapp.com",

    projectId:
    "nectar-water",

    storageBucket:
    "nectar-water.firebasestorage.app",

    messagingSenderId:
    "292708650665",

    appId:
    "1:292708650665:web:f8ec60a21665e70867a3b8",

    measurementId:
    "G-P40N8EEDRC"
};


/* INITIALIZE */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* ELEMENTS */

const loginPage =
document.getElementById("loginPage");

const adminPage =
document.getElementById("adminPage");

const loginButton =
document.getElementById("loginButton");

const logoutButton =
document.getElementById("logoutButton");

const loginMessage =
document.getElementById("loginMessage");

const adminEmail =
document.getElementById("adminEmail");

const filterDate =
document.getElementById("filterDate");

const searchBox =
document.getElementById("searchBox");

const ordersBox =
document.getElementById("orders");

const notice =
document.getElementById("notice");


/* TODAY */

function getTodayDate(){

    const now = new Date();

    const year =
    now.getFullYear();

    const month =
    String(now.getMonth()+1)
    .padStart(2,"0");

    const day =
    String(now.getDate())
    .padStart(2,"0");

    return `${year}-${month}-${day}`;
}

filterDate.value = getTodayDate();


/* LOGIN */

loginButton.addEventListener(
"click",
async function(){

    const email =
    document.getElementById("email")
    .value
    .trim();

    const password =
    document.getElementById("password")
    .value;

    if(!email || !password){

        showMessage(
            "Email और Password दोनों डालें।"
        );

        return;
    }

    loginButton.disabled = true;

    loginButton.innerText =
    "⏳ Login हो रहा है...";

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }

    catch(error){

        console.error(error);

        showMessage(
            getLoginError(error)
        );

        loginButton.disabled = false;

        loginButton.innerText =
        "🔐 Login";

    }

});


/* ENTER LOGIN */

document
.getElementById("password")
.addEventListener(
"keydown",
function(event){

    if(event.key === "Enter"){
        loginButton.click();
    }

});


/* AUTH */

onAuthStateChanged(
auth,
function(user){

    if(user){

        loginPage.style.display =
        "none";

        adminPage.style.display =
        "block";

        adminEmail.innerText =
        user.email || "";

        loadOrders();

    }

    else{

        loginPage.style.display =
        "flex";

        adminPage.style.display =
        "none";

    }

});


/* LOGOUT */

logoutButton.addEventListener(
"click",
async function(){

    await signOut(auth);

});


/* LOAD ORDERS */

async function loadOrders(){

    ordersBox.innerHTML =
    '<div class="loading">⏳ Orders load हो रहे हैं...</div>';

    notice.style.display = "none";

    const selectedDate =
    filterDate.value;

    if(!selectedDate){

        ordersBox.innerHTML =
        '<div class="empty">📅 Delivery Date चुनें।</div>';

        return;
    }

    try{

        const ordersRef =
        collection(db,"orders");

        const ordersQuery =
        query(
            ordersRef,
            where(
                "deliveryDate",
                "==",
                selectedDate
            )
        );

        const snapshot =
        await getDocs(ordersQuery);

        let orders = [];

        snapshot.forEach(
        function(docSnap){

            orders.push({

                id:docSnap.id,

                ...docSnap.data()

            });

        });


        orders.sort(
        function(a,b){

            return String(
                b.orderNumber || ""
            ).localeCompare(
                String(
                    a.orderNumber || ""
                )
            );

        });


        window.currentOrders =
        orders;

        renderOrders();

        await loadDailyStats(
            selectedDate
        );

    }

    catch(error){

        console.error(
            "Load Orders Error:",
            error
        );

        ordersBox.innerHTML =
        '<div class="empty">❌ Orders load नहीं हो पाए। Firestore Rules check करें।</div>';

    }

}


/* DAILY STATS */

async function loadDailyStats(date){

    try{

        const bookingRef =
        doc(
            db,
            "dailyBookings",
            date
        );

        const bookingSnap =
        await getDoc(bookingRef);

        let booked = 0;

        if(bookingSnap.exists()){

            booked =
            Number(
                bookingSnap.data().bookedJar
            ) || 0;

        }


        const orders =
        window.currentOrders || [];


        let sales = 0;


        orders.forEach(
        function(order){

            if(
                order.status !== "Cancelled"
            ){

                sales +=
                Number(
                    order.grandTotal
                ) || 0;

            }

        });


        document.getElementById(
            "bookedJar"
        ).innerText =
        `${booked} / 300`;


        document.getElementById(
            "totalOrders"
        ).innerText =
        orders.length;


        document.getElementById(
            "totalSales"
        ).innerText =
        "₹" + sales.toFixed(2);

    }

    catch(error){

        console.error(error);

    }

}


/* RENDER */

function renderOrders(){

    let orders =
    window.currentOrders || [];


    const search =
    searchBox.value
    .trim()
    .toLowerCase();


    if(search){

        orders =
        orders.filter(
        function(order){

            const text =

            String(
                order.orderNumber || ""
            ) + " " +

            String(
                order.name || ""
            ) + " " +

            String(
                order.mobile || ""
            ) + " " +

            String(
                order.address || ""
            );

            return text
            .toLowerCase()
            .includes(search);

        });

    }


    if(orders.length === 0){

        ordersBox.innerHTML =
        '<div class="empty">📭 इस तारीख के लिए कोई order नहीं मिला।</div>';

        return;

    }


    ordersBox.innerHTML = "";


    orders.forEach(
    function(order){

        const status =
        order.status || "Pending";


        const isDelivered =
        status === "Delivered";

        const isCancelled =
        status === "Cancelled";


        const card =
        document.createElement("div");

        card.className = "order";


        let statusClass = "pending";

        let statusText = "🟡 Pending";


        if(isDelivered){

            statusClass = "delivered";

            statusText = "🟢 Delivered";

        }


        if(isCancelled){

            statusClass = "cancelled";

            statusText = "❌ Cancelled";

        }


        card.innerHTML = `

        <div class="order-head">

            <div class="order-number">

                🆔 ${escapeHtml(
                    order.orderNumber || "-"
                )}

            </div>

            <div class="status ${statusClass}">

                ${statusText}

            </div>

        </div>


        <div class="order-grid">


            <div class="detail">

                <b>👤 Customer</b>

                ${escapeHtml(
                    order.name || "-"
                )}

            </div>


            <div class="detail">

                <b>📱 Mobile</b>

                ${escapeHtml(
                    order.mobile || "-"
                )}

            </div>


            <div class="detail">

                <b>📅 Delivery Date</b>

                ${escapeHtml(
                    order.deliveryDateDisplay ||
                    order.deliveryDate ||
                    "-"
                )}

            </div>


            <div class="detail">

                <b>🪣 Jar</b>

                ${Number(
                    order.quantity || 0
                )}

            </div>


            <div class="detail">

                <b>📍 Distance</b>

                ${Number(
                    order.distance || 0
                )} KM

            </div>


            <div class="detail">

                <b>🚚 Delivery Charge</b>

                ₹${Number(
                    order.deliveryCharge || 0
                ).toFixed(2)}

            </div>


            <div class="detail">

                <b>💰 Jar Amount</b>

                ₹${Number(
                    order.jarAmount || 0
                ).toFixed(2)}

            </div>


            <div class="detail">

                <b>💵 Grand Total</b>

                ₹${Number(
                    order.grandTotal || 0
                ).toFixed(2)}

            </div>


            <div
                class="detail"
                style="grid-column:1/-1"
            >

                <b>📍 Address</b>

                ${escapeHtml(
                    order.address || "-"
                )}

            </div>


            <div
                class="detail"
                style="grid-column:1/-1"
            >

                <b>📝 Extra Information</b>

                ${escapeHtml(
                    order.extra ||
                    "कोई जानकारी नहीं"
                )}

            </div>

        </div>


        <div class="actions">


            <a
                class="action-btn call-btn"
                href="tel:${escapeHtml(
                    order.mobile || ""
                )}"
            >

                📞 Call

            </a>


            <a
                class="action-btn whatsapp-btn"
                target="_blank"
                href="https://wa.me/91${escapeHtml(
                    order.mobile || ""
                )}?text=${encodeURIComponent(
                    "नमस्ते, Nectar Water से आपके Order " +
                    (order.orderNumber || "") +
                    " के संबंध में संपर्क कर रहे हैं।"
                )}"
            >

                📱 WhatsApp

            </a>


            ${
                !isCancelled
                ? `
                <button
                    class="action-btn ${
                        isDelivered
                        ? "pending-btn"
                        : "deliver-btn"
                    }"
                    onclick="changeStatus(
                        '${escapeHtml(order.id)}',
                        '${isDelivered ? "Pending" : "Delivered"}'
                    )"
                >

                    ${
                        isDelivered
                        ? "↩️ Pending करें"
                        : "✅ Delivered करें"
                    }

                </button>

                <button
                    class="action-btn cancel-btn"
                    onclick="cancelOrder(
                        '${escapeHtml(order.id)}'
                    )"
                >

                    ❌ Cancel Order

                </button>
                `
                : `
                <button
                    class="action-btn pending-btn"
                    onclick="changeStatus(
                        '${escapeHtml(order.id)}',
                        'Pending'
                    )"
                >

                    ↩️ Order वापस लाएँ

                </button>
                `
            }

        </div>

        `;


        ordersBox.appendChild(card);

    });


    document.getElementById(
        "totalOrders"
    ).innerText =
    orders.length;

}


/* CHANGE STATUS */

window.changeStatus =
async function(
    orderId,
    newStatus
){

    try{

        await updateDoc(
            doc(
                db,
                "orders",
                orderId
            ),
            {
                status:newStatus
            }
        );


        await loadOrders();

    }

    catch(error){

        console.error(error);

        alert(
            "❌ Status update नहीं हो पाया। Firestore Rules में update की permission check करें।"
        );

    }

};


/* CANCEL ORDER */

window.cancelOrder =
async function(orderId){

    const order =
    (window.currentOrders || [])
    .find(
        o => o.id === orderId
    );


    if(!order){

        alert("Order नहीं मिला।");

        return;

    }


    const confirmCancel =
    confirm(
        "क्या आप इस Order को Cancel करना चाहते हैं?\n\n" +
        "Order: " +
        (order.orderNumber || "") +
        "\n" +
        "Jar: " +
        (order.quantity || 0)
    );


    if(!confirmCancel){

        return;

    }


    try{

        await updateDoc(
            doc(
                db,
                "orders",
                orderId
            ),
            {
                status:"Cancelled"
            }
        );


        /*
          ध्यान दें:
          यहाँ dailyBookings का bookedJar
          अपने आप कम नहीं किया जा रहा है।
          इससे booking count सुरक्षित रहेगा।
        */


        await loadOrders();

        showNotice(
            "✅ Order Cancelled हो गया।"
        );

    }

    catch(error){

        console.error(error);

        alert(
            "❌ Order Cancel नहीं हो पाया। Firestore Rules check करें।"
        );

    }

};


/* SEARCH */

searchBox.addEventListener(
"input",
function(){

    renderOrders();

});


/* DATE */

filterDate.addEventListener(
"change",
function(){

    loadOrders();

});


/* REFRESH */

document.getElementById(
"refreshButton"
).addEventListener(
"click",
function(){

    loadOrders();

});


/* NOTICE */

function showNotice(text){

    notice.innerText = text;

    notice.style.display = "block";

    setTimeout(
    function(){

        notice.style.display = "none";

    },
    3000
    );

}


/* LOGIN MESSAGE */

function showMessage(text){

    loginMessage.innerText = text;

    loginMessage.className =
    "message error";

    loginMessage.style.display =
    "block";

}


/* LOGIN ERRORS */

function getLoginError(error){

    if(
        error.code ===
        "auth/invalid-credential"
    ){

        return "❌ Email या Password गलत है।";

    }

    if(
        error.code ===
        "auth/user-not-found"
    ){

        return "❌ Admin account मौजूद नहीं है।";

    }

    if(
        error.code ===
        "auth/wrong-password"
    ){

        return "❌ Password गलत है।";

    }

    if(
        error.code ===
        "auth/too-many-requests"
    ){

        return "⚠️ बहुत अधिक प्रयास हुए हैं। कुछ देर बाद प्रयास करें।";

    }

    if(
        error.code ===
        "auth/operation-not-allowed"
    ){

        return "⚠️ Firebase में Email/Password Login Enable करें।";

    }

    return "❌ Login Error: " + error.message;

}


/* HTML ESCAPE */

function escapeHtml(value){

    return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}
