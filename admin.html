<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nectar Water - Admin Panel</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#1e293b;
}

/* LOGIN */
#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
}

.loginBox{
  width:100%;
  max-width:400px;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
  text-align:center;
  font-size:55px;
}

.loginBox h1{
  text-align:center;
  margin:8px 0;
}

.loginBox p{
  text-align:center;
  color:#64748b;
}

input,button{
  width:100%;
  padding:13px;
  margin-top:10px;
  border-radius:9px;
  font-size:16px;
}

input{
  border:1px solid #cbd5e1;
}

button{
  border:0;
  background:#2563eb;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.error{
  color:#dc2626;
  text-align:center;
  margin-top:12px;
}

/* ADMIN */
#adminPage{
  display:none;
}

.header{
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:white;
  padding:18px;
}

.headerInner{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.header h1{
  margin:0;
}

.logout{
  width:auto;
  background:white;
  color:#2563eb;
  padding:10px 18px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

/* FILTER */
.filter{
  background:white;
  padding:18px;
  border-radius:15px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.filterGrid{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:12px;
  align-items:end;
}

.refresh{
  width:auto;
  padding:13px 20px;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:white;
  padding:20px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.statTitle{
  color:#64748b;
  font-size:14px;
}

.statValue{
  font-size:28px;
  font-weight:bold;
  margin-top:8px;
}

/* ORDER */
.order{
  background:white;
  padding:20px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.orderHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.orderNo{
  font-size:18px;
  font-weight:bold;
}

.status{
  padding:7px 12px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
}

.pending{
  background:#fef3c7;
  color:#92400e;
}

.delivered{
  background:#dcfce7;
  color:#166534;
}

.orderGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.detail{
  background:#f8fafc;
  padding:11px;
  border-radius:8px;
}

.detail b{
  display:block;
  margin-bottom:4px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

.action{
  width:auto;
  text-decoration:none;
  padding:10px 15px;
  border-radius:8px;
  color:white;
  font-weight:bold;
  border:0;
}

.call{
  background:#0284c7;
}

.whatsapp{
  background:#16a34a;
}

.deliver{
  background:#15803d;
}

.markPending{
  background:#d97706;
}

.empty{
  background:white;
  padding:30px;
  border-radius:15px;
  text-align:center;
  color:#64748b;
}

@media(max-width:700px){

  .filterGrid{
    grid-template-columns:1fr;
  }

  .refresh{
    width:100%;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .orderGrid{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>


<!-- ================= LOGIN ================= -->

<div id="loginPage">

  <div class="loginBox">

    <div class="logo">💧</div>

    <h1>Nectar Water</h1>

    <p>Admin Panel Login</p>

    <input
      id="email"
      type="email"
      placeholder="Admin Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button id="loginBtn">
      🔐 Login
    </button>

    <div
      id="loginError"
      class="error">
    </div>

  </div>

</div>


<!-- ================= ADMIN ================= -->

<div id="adminPage">

  <div class="header">

    <div class="headerInner">

      <div>
        <h1>💧 Nectar Water Admin</h1>
        <div id="adminEmail"></div>
      </div>

      <button
        id="logoutBtn"
        class="logout">
        🚪 Logout
      </button>

    </div>

  </div>


  <div class="container">


    <!-- FILTER -->

    <div class="filter">

      <div class="filterGrid">

        <div>

          <label>
            📅 Delivery Date
          </label>

          <input
            id="deliveryDate"
            type="date"
          >

        </div>


        <div>

          <label>
            🔎 Search
          </label>

          <input
            id="search"
            type="text"
            placeholder="नाम / मोबाइल / Order No."
          >

        </div>


        <button
          id="refreshBtn"
          class="refresh">

          🔄 Refresh

        </button>

      </div>

    </div>


    <!-- STATS -->

    <div class="stats">

      <div class="stat">

        <div class="statTitle">
          🪣 Booked Jar
        </div>

        <div
          id="jarTotal"
          class="statValue">

          0 / 300

        </div>

      </div>


      <div class="stat">

        <div class="statTitle">
          📦 Total Orders
        </div>

        <div
          id="orderTotal"
          class="statValue">

          0

        </div>

      </div>


      <div class="stat">

        <div class="statTitle">
          💰 Total Sales
        </div>

        <div
          id="salesTotal"
          class="statValue">

          ₹0

        </div>

      </div>

    </div>


    <h2>
      📋 Orders
    </h2>


    <div id="ordersList">

      <div class="empty">
        ⏳ Orders load हो रहे हैं...
      </div>

    </div>

  </div>

</div>


<!-- ================= FIREBASE ================= -->

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  doc,
  getDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ================= FIREBASE CONFIG ================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyC3qW2tnclJO65ziiptBAWxzifPoSLcKTw",

  authDomain:
  "nectar-water-e42b4.firebaseapp.com",

  projectId:
  "nectar-water",

  storageBucket:
  "nectar-water.firebasestorage.app",

  messagingSenderId:
  "292708650665",

  appId:
  "1:292708650665:web:f8ec60a21665e70867a3b8",

  measurementId:
  "G-P40N8EEDRC"

};


/* ================= INITIALIZE ================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* ================= ELEMENTS ================= */

const loginPage =
  document.getElementById("loginPage");

const adminPage =
  document.getElementById("adminPage");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginBtn =
  document.getElementById("loginBtn");

const loginError =
  document.getElementById("loginError");

const deliveryDate =
  document.getElementById("deliveryDate");

const searchInput =
  document.getElementById("search");

const ordersList =
  document.getElementById("ordersList");


/* ================= TODAY ================= */

function getToday(){

  const d =
    new Date();

  const year =
    d.getFullYear();

  const month =
    String(
      d.getMonth()+1
    ).padStart(2,"0");

  const day =
    String(
      d.getDate()
    ).padStart(2,"0");

  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}

deliveryDate.value =
  getToday();


/* ================= LOGIN ================= */

loginBtn.addEventListener(
  "click",
  async()=>{

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    if(!email || !password){

      loginError.innerText =
        "Email और Password डालें।";

      return;

    }


    loginBtn.disabled =
      true;

    loginBtn.innerText =
      "⏳ Login...";


    try{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      loginError.innerText =
        "";

    }

    catch(error){

      console.error(error);

      loginError.innerText =
        "❌ Email या Password गलत है।";

    }


    loginBtn.disabled =
      false;

    loginBtn.innerText =
      "🔐 Login";

  }
);


/* ================= ENTER LOGIN ================= */

passwordInput.addEventListener(
  "keydown",
  e=>{

    if(e.key === "Enter"){
      loginBtn.click();
    }

  }
);


/* ================= AUTH ================= */

onAuthStateChanged(
  auth,
  user=>{

    if(user){

      loginPage.style.display =
        "none";

      adminPage.style.display =
        "block";

      document
      .getElementById("adminEmail")
      .innerText =
        user.email || "";

      loadOrders();

    }
    else{

      loginPage.style.display =
        "flex";

      adminPage.style.display =
        "none";

    }

  }
);


/* ================= LOGOUT ================= */

document
.getElementById("logoutBtn")
.addEventListener(
  "click",
  async()=>{

    await signOut(auth);

  }
);


/* ================= ORDERS ================= */

let allOrders = [];


async function loadOrders(){

  const date =
    deliveryDate.value;


  ordersList.innerHTML =
    '<div class="empty">⏳ Orders load हो रहे हैं...</div>';


  try{

    const ordersRef =
      collection(
        db,
        "orders"
      );


    const q =
      query(
        ordersRef,
        where(
          "deliveryDate",
          "==",
          date
        )
      );


    const snapshot =
      await getDocs(q);


    allOrders = [];


    snapshot.forEach(
      item=>{

        allOrders.push({

          id:item.id,

          ...item.data()

        });

      }
    );


    displayOrders();


    loadBookingCount(date);

  }

  catch(error){

    console.error(
      "Firebase Error:",
      error
    );


    ordersList.innerHTML = `

      <div class="empty">

        ❌ Orders load नहीं हो पाए।<br><br>

        Firebase Firestore Rules check करें।

      </div>

    `;

  }

}


/* ================= DISPLAY ================= */

function displayOrders(){

  let orders =
    [...allOrders];


  const search =
    searchInput.value
    .trim()
    .toLowerCase();


  if(search){

    orders =
      orders.filter(
        order=>{

          const text =
            (
              order.name || ""
            ) +
            " " +
            (
              order.mobile || ""
            ) +
            " " +
            (
              order.orderNumber || ""
            );

          return text
            .toLowerCase()
            .includes(search);

        }
      );

  }


  let jars = 0;

  let sales = 0;


  allOrders.forEach(
    order=>{

      jars +=
        Number(
          order.quantity
        ) || 0;

      sales +=
        Number(
          order.grandTotal
        ) || 0;

    }
  );


  document
  .getElementById("jarTotal")
  .innerText =
    jars + " / 300";


  document
  .getElementById("orderTotal")
  .innerText =
    allOrders.length;


  document
  .getElementById("salesTotal")
  .innerText =
    "₹" +
    sales.toFixed(2);


  if(orders.length === 0){

    ordersList.innerHTML =
      '<div class="empty">📭 कोई order नहीं मिला।</div>';

    return;

  }


  ordersList.innerHTML =
    "";


  orders.forEach(
    order=>{

      const status =
        order.status ||
        "Pending";


      const delivered =
        status ===
        "Delivered";


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "order";


      card.innerHTML = `

        <div class="orderHeader">

          <div class="orderNo">

            🆔 Order:
            ${safe(
              order.orderNumber ||
              order.id
            )}

          </div>


          <div class="status ${
            delivered
            ? "delivered"
            : "pending"
          }">

            ${
              delivered
              ? "🟢 Delivered"
              : "🟡 Pending"
            }

          </div>

        </div>


        <div class="orderGrid">


          <div class="detail">

            <b>👤 Customer</b>

            ${safe(
              order.name ||
              "-"
            )}

          </div>


          <div class="detail">

            <b>📱 Mobile</b>

            ${safe(
              order.mobile ||
              "-"
            )}

          </div>


          <div class="detail">

            <b>📅 Delivery Date</b>

            ${safe(
              order.deliveryDateDisplay ||
              order.deliveryDate ||
              "-"
            )}

          </div>


          <div class="detail">

            <b>🪣 Jar</b>

            ${Number(
              order.quantity
            ) || 0}

          </div>


          <div class="detail">

            <b>📍 Distance</b>

            ${Number(
              order.distance
            ) || 0}
            KM

          </div>


          <div class="detail">

            <b>🚚 Delivery Charge</b>

            ₹${(
              Number(
                order.deliveryCharge
              ) || 0
            ).toFixed(2)}

          </div>


          <div class="detail">

            <b>💰 Jar Amount</b>

            ₹${(
              Number(
                order.jarAmount
              ) || 0
            ).toFixed(2)}

          </div>


          <div class="detail">

            <b>💵 Grand Total</b>

            ₹${(
              Number(
                order.grandTotal
              ) || 0
            ).toFixed(2)}

          </div>


          <div
            class="detail"
            style="grid-column:1/-1">

            <b>📍 Address</b>

            ${safe(
              order.address ||
              "-"
            )}

          </div>


          <div
            class="detail"
            style="grid-column:1/-1">

            <b>📝 Extra</b>

            ${safe(
              order.extra ||
              "कोई जानकारी नहीं"
            )}

          </div>


        </div>


        <div class="actions">


          <a
            class="action call"
            href="tel:${safe(
              order.mobile || ""
            )}">

            📞 Call

          </a>


          <a
            class="action whatsapp"
            target="_blank"
            href="https://wa.me/91${safe(
              order.mobile || ""
            )}">

            📱 WhatsApp

          </a>


          <button
            class="action ${
              delivered
              ? "markPending"
              : "deliver"
            }"
            data-id="${safe(order.id)}"
            data-status="${
              delivered
              ? "Pending"
              : "Delivered"
            }">

            ${
              delivered
              ? "↩️ Pending करें"
              : "✅ Delivered करें"
            }

          </button>


        </div>

      `;


      const statusButton =
        card.querySelector(
          "button[data-id]"
        );


      statusButton.addEventListener(
        "click",
        ()=>{

          changeStatus(
            statusButton.dataset.id,
            statusButton.dataset.status
          );

        }
      );


      ordersList.appendChild(
        card
      );

    }
  );

}


/* ================= STATUS ================= */

async function changeStatus(
  id,
  newStatus
){

  try{

    await updateDoc(

      doc(
        db,
        "orders",
        id
      ),

      {
        status:
          newStatus
      }

    );


    await loadOrders();

  }

  catch(error){

    console.error(error);

    alert(
      "❌ Status update नहीं हो पाया।"
    );

  }

}


/* ================= BOOKING COUNT ================= */

async function loadBookingCount(
  date
){

  try{

    const ref =
      doc(
        db,
        "dailyBookings",
        date
      );


    const snap =
      await getDoc(ref);


    if(snap.exists()){

      const data =
        snap.data();


      const booked =
        Number(
          data.bookedJar
        ) || 0;


      document
      .getElementById("jarTotal")
      .innerText =
        booked +
        " / 300";

    }

  }

  catch(error){

    console.log(
      "dailyBookings:",
      error
    );

  }

}


/* ================= SEARCH ================= */

searchInput.addEventListener(
  "input",
  displayOrders
);


/* ================= DATE ================= */

deliveryDate.addEventListener(
  "change",
  loadOrders
);


/* ================= REFRESH ================= */

document
.getElementById("refreshBtn")
.addEventListener(
  "click",
  loadOrders
);


/* ================= SAFE TEXT ================= */

function safe(value){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}

</script>

</body>
</html>
