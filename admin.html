<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nectar Water - Admin Panel</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#1e293b;
}

button,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* ================= LOGIN ================= */

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
}

.loginBox{
  width:100%;
  max-width:400px;
  background:#fff;
  padding:30px;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
  text-align:center;
  font-size:55px;
}

.loginBox h1{
  text-align:center;
  margin:8px 0;
}

.loginBox p{
  text-align:center;
  color:#64748b;
}

.loginBox input{
  width:100%;
  padding:13px;
  margin-top:12px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  font-size:16px;
}

.loginBtn{
  width:100%;
  padding:13px;
  margin-top:15px;
  border:0;
  border-radius:9px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.loginError{
  color:#dc2626;
  text-align:center;
  margin-top:12px;
}

/* ================= ADMIN ================= */

#adminPage{
  display:none;
}

.header{
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:white;
  padding:18px;
}

.headerInner{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.header h1{
  margin:0 0 5px;
  font-size:24px;
}

.adminEmail{
  font-size:13px;
  opacity:.9;
}

.logout{
  width:auto;
  padding:10px 18px;
  border:0;
  border-radius:8px;
  background:#fff;
  color:#2563eb;
  font-weight:bold;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

/* ================= FILTER ================= */

.filter{
  background:#fff;
  padding:18px;
  border-radius:15px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.filterGrid{
  display:grid;
  grid-template-columns:1fr 1fr auto auto;
  gap:12px;
  align-items:end;
}

.filter label{
  display:block;
  font-weight:bold;
  margin-bottom:5px;
}

.filter input{
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:15px;
}

.refresh,
.printReport{
  width:auto;
  padding:12px 18px;
  border:0;
  border-radius:8px;
  color:white;
  font-weight:bold;
}

.refresh{
  background:#2563eb;
}

.printReport{
  background:#475569;
}

/* ================= STATS ================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:white;
  padding:20px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.statTitle{
  color:#64748b;
  font-size:14px;
}

.statValue{
  font-size:28px;
  font-weight:bold;
  margin-top:8px;
}

/* ================= ORDERS ================= */

.order{
  background:#fff;
  padding:20px;
  border-radius:15px;
  margin-bottom:15px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.orderHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:15px;
}

.orderNo{
  font-size:18px;
  font-weight:bold;
}

.status{
  padding:7px 12px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
}

.pending{
  background:#fef3c7;
  color:#92400e;
}

.delivered{
  background:#dcfce7;
  color:#166534;
}

.orderGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.detail{
  background:#f8fafc;
  padding:11px;
  border-radius:8px;
  line-height:1.5;
}

.detail b{
  display:block;
  margin-bottom:3px;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:15px;
}

.action{
  width:auto;
  padding:10px 14px;
  border:0;
  border-radius:8px;
  color:white;
  font-weight:bold;
  text-decoration:none;
}

.call{
  background:#0284c7;
}

.whatsapp{
  background:#16a34a;
}

.deliver{
  background:#15803d;
}

.markPending{
  background:#d97706;
}

.printOrder{
  background:#475569;
}

.empty{
  background:#fff;
  padding:30px;
  border-radius:15px;
  text-align:center;
  color:#64748b;
}

.loading{
  text-align:center;
  padding:20px;
}

/* ================= REPORT ================= */

#reportArea{
  display:none;
}


/* ================= MOBILE ================= */

@media(max-width:800px){

  .filterGrid{
    grid-template-columns:1fr;
  }

  .refresh,
  .printReport{
    width:100%;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .orderGrid{
    grid-template-columns:1fr;
  }

  .headerInner{
    flex-direction:column;
    align-items:flex-start;
  }

  .logout{
    width:100%;
  }

}


/* ================= PRINT ================= */

@media print{

  body{
    background:white;
  }

  #loginPage,
  .header,
  .filter,
  .stats,
  #ordersList{
    display:none !important;
  }

  #adminPage{
    display:block !important;
  }

  #reportArea{
    display:block !important;
  }

  .printReportPage{
    padding:20px;
  }

  table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
  }

  th,
  td{
    border:1px solid #333;
    padding:8px;
    text-align:left;
  }

  h1,
  h2{
    text-align:center;
  }

}
</style>
</head>


<body>


<!-- =====================================================
     LOGIN PAGE
===================================================== -->

<div id="loginPage">

  <div class="loginBox">

    <div class="logo">💧</div>

    <h1>Nectar Water</h1>

    <p>Admin Panel Login</p>

    <input
      id="email"
      type="email"
      placeholder="Admin Email"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      id="loginBtn"
      class="loginBtn">

      🔐 Login

    </button>

    <div
      id="loginError"
      class="loginError">
    </div>

  </div>

</div>


<!-- =====================================================
     ADMIN PAGE
===================================================== -->

<div id="adminPage">


  <div class="header">

    <div class="headerInner">

      <div>

        <h1>💧 Nectar Water Admin</h1>

        <div
          id="adminEmail"
          class="adminEmail">
        </div>

      </div>


      <button
        id="logoutBtn"
        class="logout">

        🚪 Logout

      </button>

    </div>

  </div>


  <div class="container">


    <!-- FILTER -->

    <div class="filter">

      <div class="filterGrid">


        <div>

          <label>
            📅 Delivery Date
          </label>

          <input
            id="deliveryDate"
            type="date"
          >

        </div>


        <div>

          <label>
            🔎 Search
          </label>

          <input
            id="search"
            type="text"
            placeholder="Order / Mobile / Name"
          >

        </div>


        <button
          id="refreshBtn"
          class="refresh">

          🔄 Refresh

        </button>


        <button
          id="printReportBtn"
          class="printReport">

          🖨️ Daily Report

        </button>


      </div>

    </div>


    <!-- STATISTICS -->

    <div class="stats">


      <div class="stat">

        <div class="statTitle">
          🪣 Booked Jar
        </div>

        <div
          id="jarTotal"
          class="statValue">

          0 / 300

        </div>

      </div>


      <div class="stat">

        <div class="statTitle">
          📦 Total Orders
        </div>

        <div
          id="orderTotal"
          class="statValue">

          0

        </div>

      </div>


      <div class="stat">

        <div class="statTitle">
          💰 Total Sales
        </div>

        <div
          id="salesTotal"
          class="statValue">

          ₹0.00

        </div>

      </div>


    </div>


    <h2>
      📋 Orders
    </h2>


    <div id="ordersList">

      <div class="loading">
        ⏳ Orders load हो रहे हैं...
      </div>

    </div>


    <!-- PRINT REPORT -->

    <div id="reportArea">

      <div class="printReportPage">

        <h1>
          💧 Nectar Water
        </h1>

        <h2>
          Daily Order Report
        </h2>

        <p>
          <b>Delivery Date:</b>
          <span id="reportDate"></span>
        </p>

        <p>
          <b>Total Orders:</b>
          <span id="reportOrders"></span>
        </p>

        <p>
          <b>Total Jar:</b>
          <span id="reportJars"></span>
        </p>

        <p>
          <b>Total Sales:</b>
          ₹<span id="reportSales"></span>
        </p>


        <table>

          <thead>

            <tr>

              <th>Order</th>

              <th>Customer</th>

              <th>Mobile</th>

              <th>Jar</th>

              <th>Total</th>

              <th>Status</th>

            </tr>

          </thead>


          <tbody id="reportTable">

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">


import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  query,
  where,
  getDocs,
  doc,
  getDoc,
  updateDoc
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

  apiKey:
  "AIzaSyC3qW2tnclJO65ziiptBAWxzifPoSLcKTw",

  authDomain:
  "nectar-water-e42b4.firebaseapp.com",

  projectId:
  "nectar-water",

  storageBucket:
  "nectar-water.firebasestorage.app",

  messagingSenderId:
  "292708650665",

  appId:
  "1:292708650665:web:f8ec60a21665e70867a3b8",

  measurementId:
  "G-P40N8EEDRC"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const db =
  getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const loginPage =
  document.getElementById(
    "loginPage"
  );


const adminPage =
  document.getElementById(
    "adminPage"
  );


const emailInput =
  document.getElementById(
    "email"
  );


const passwordInput =
  document.getElementById(
    "password"
  );


const loginBtn =
  document.getElementById(
    "loginBtn"
  );


const loginError =
  document.getElementById(
    "loginError"
  );


const deliveryDate =
  document.getElementById(
    "deliveryDate"
  );


const searchInput =
  document.getElementById(
    "search"
  );


const ordersList =
  document.getElementById(
    "ordersList"
  );


/* =====================================================
   TODAY DATE
===================================================== */

function getToday(){

  const d =
    new Date();

  return (

    d.getFullYear()
    + "-"
    +
    String(
      d.getMonth()+1
    ).padStart(2,"0")
    + "-"
    +
    String(
      d.getDate()
    ).padStart(2,"0")

  );

}


deliveryDate.value =
  getToday();


/* =====================================================
   LOGIN
===================================================== */

loginBtn.addEventListener(
  "click",
  async()=>{

    const email =
      emailInput
      .value
      .trim();


    const password =
      passwordInput
      .value;


    if(
      !email ||
      !password
    ){

      loginError.innerText =
        "Email और Password डालें।";

      return;

    }


    loginBtn.disabled =
      true;


    loginBtn.innerText =
      "⏳ Login हो रहा है...";


    try{

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


      loginError.innerText =
        "";

    }

    catch(error){

      console.error(error);


      loginError.innerText =
        "❌ Login नहीं हुआ। Email/Password जाँचें।";

    }


    loginBtn.disabled =
      false;


    loginBtn.innerText =
      "🔐 Login";

  }
);


/* =====================================================
   ENTER TO LOGIN
===================================================== */

passwordInput.addEventListener(
  "keydown",
  event=>{

    if(
      event.key ===
      "Enter"
    ){

      loginBtn.click();

    }

  }
);


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
  auth,
  user=>{

    if(user){

      loginPage.style.display =
        "none";


      adminPage.style.display =
        "block";


      document
      .getElementById(
        "adminEmail"
      )
      .innerText =
        user.email || "";


      loadOrders();

    }

    else{

      loginPage.style.display =
        "flex";


      adminPage.style.display =
        "none";

    }

  }
);


/* =====================================================
   LOGOUT
===================================================== */

document
.getElementById(
  "logoutBtn"
)
.addEventListener(
  "click",
  async()=>{

    await signOut(auth);

  }
);


/* =====================================================
   ALL ORDERS
===================================================== */

let allOrders = [];


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders(){

  const date =
    deliveryDate.value;


  ordersList.innerHTML =
    `
      <div class="loading">
        ⏳ Orders load हो रहे हैं...
      </div>
    `;


  try{

    const ordersRef =
      collection(
        db,
        "orders"
      );


    const q =
      query(

        ordersRef,

        where(
          "deliveryDate",
          "==",
          date
        )

      );


    const snapshot =
      await getDocs(q);


    allOrders = [];


    snapshot.forEach(
      item=>{

        allOrders.push({

          id:
            item.id,

          ...item.data()

        });

      }
    );


    displayOrders();


    await loadBookingCount(
      date
    );

  }

  catch(error){

    console.error(
      "Firestore Error:",
      error
    );


    ordersList.innerHTML =
      `
        <div class="empty">

          ❌ Orders load नहीं हुए।

          <br><br>

          Firebase Rules या
          deliveryDate field check करें।

        </div>
      `;

  }

}


/* =====================================================
   DISPLAY ORDERS
===================================================== */

function displayOrders(){

  let orders =
    [...allOrders];


  const search =
    searchInput
    .value
    .trim()
    .toLowerCase();


  if(search){

    orders =
      orders.filter(
        order=>{

          const text =

            String(
              order.name || ""
            )

            + " "

            +

            String(
              order.mobile || ""
            )

            + " "

            +

            String(
              order.orderNumber || ""
            );


          return text
            .toLowerCase()
            .includes(
              search
            );

        }
      );

  }


  /* =================
     TOTALS
  ================= */

  let jars = 0;

  let sales = 0;


  allOrders.forEach(
    order=>{

      jars +=
        Number(
          order.quantity
        ) || 0;


      sales +=
        Number(
          order.grandTotal
        ) || 0;

    }
  );


  document
  .getElementById(
    "jarTotal"
  )
  .innerText =
    jars +
    " / 300";


  document
  .getElementById(
    "orderTotal"
  )
  .innerText =
    allOrders.length;


  document
  .getElementById(
    "salesTotal"
  )
  .innerText =
    "₹" +
    sales.toFixed(2);


  /* =================
     NO ORDERS
  ================= */

  if(
    orders.length ===
    0
  ){

    ordersList.innerHTML =
      `
        <div class="empty">
          📭 कोई order नहीं मिला।
        </div>
      `;

    return;

  }


  ordersList.innerHTML =
    "";


  /* =================
     CREATE ORDER CARDS
  ================= */

  orders.forEach(
    order=>{

      const status =
        order.status ||
        "Pending";


      const isDelivered =
        status ===
        "Delivered";


      const mobile =
        String(
          order.mobile || ""
        )
        .replace(
          /\D/g,
          ""
        );


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "order";


      card.innerHTML = `

        <div class="orderHeader">

          <div class="orderNo">

            🆔 Order:
            ${safe(
              order.orderNumber ||
              order.id
            )}

          </div>


          <div class="status ${
            isDelivered
            ? "delivered"
            : "pending"
          }">

            ${
              isDelivered
              ? "🟢 Delivered"
              : "🟡 Pending"
            }

          </div>

        </div>


        <div class="orderGrid">


          <div class="detail">

            <b>👤 Customer</b>

            ${safe(
              order.name ||
              "-"
            )}

          </div>


          <div class="detail">

            <b>📱 Mobile</b>

            ${safe(
              order.mobile ||
              "-"
            )}

          </div>


          <div class="detail">

            <b>📅 Delivery Date</b>

            ${safe(
              order.deliveryDateDisplay ||
              order.deliveryDate ||
              "-"
            )}

          </div>


          <div class="detail">

            <b>🪣 Jar</b>

            ${
              Number(
                order.quantity
              ) || 0
            }

          </div>


          <div class="detail">

            <b>📍 Distance</b>

            ${
              Number(
                order.distance
              ) || 0
            }
            KM

          </div>


          <div class="detail">

            <b>🚚 Delivery Charge</b>

            ₹${
              (
                Number(
                  order.deliveryCharge
                ) || 0
              ).toFixed(2)
            }

          </div>


          <div class="detail">

            <b>💰 Jar Amount</b>

            ₹${
              (
                Number(
                  order.jarAmount
                ) || 0
              ).toFixed(2)
            }

          </div>


          <div class="detail">

            <b>💵 Grand Total</b>

            ₹${
              (
                Number(
                  order.grandTotal
                ) || 0
              ).toFixed(2)
            }

          </div>


          <div
            class="detail"
            style="grid-column:1/-1">

            <b>📍 Address</b>

            ${safe(
              order.address ||
              "-"
            )}

          </div>


          <div
            class="detail"
            style="grid-column:1/-1">

            <b>📝 Extra</b>

            ${safe(
              order.extra ||
              "कोई जानकारी नहीं"
            )}

          </div>


        </div>


        <div class="actions">


          <a
            class="action call"
            href="tel:${safe(mobile)}">

            📞 Call

          </a>


          <a
            class="action whatsapp"
            target="_blank"
            href="https://wa.me/91${safe(mobile)}">

            📱 WhatsApp

          </a>


          <button
            class="action printOrder">

            🖨️ Print

          </button>


          <button
            class="action ${
              isDelivered
              ? "markPending"
              : "deliver"
            }">

            ${
              isDelivered
              ? "↩️ Pending करें"
              : "✅ Delivered करें"
            }

          </button>


        </div>

      `;


      /* STATUS BUTTON */

      const buttons =
        card.querySelectorAll(
          "button"
        );


      const printButton =
        buttons[0];


      const statusButton =
        buttons[1];


      printButton.addEventListener(
        "click",
        ()=>{

          printSingleOrder(
            order
          );

        }
      );


      statusButton.addEventListener(
        "click",
        ()=>{

          changeStatus(
            order.id,
            isDelivered
            ? "Pending"
            : "Delivered"
          );

        }
      );


      ordersList.appendChild(
        card
      );

    }
  );

}


/* =====================================================
   BOOKING COUNT
===================================================== */

async function loadBookingCount(
  date
){

  try{

    const bookingRef =
      doc(
        db,
        "dailyBookings",
        date
      );


    const bookingSnap =
      await getDoc(
        bookingRef
      );


    if(
      bookingSnap.exists()
    ){

      const data =
        bookingSnap.data();


      const booked =
        Number(
          data.bookedJar
        ) || 0;


      document
      .getElementById(
        "jarTotal"
      )
      .innerText =
        booked +
        " / 300";

    }

  }

  catch(error){

    console.log(
      "dailyBookings error:",
      error
    );

  }

}


/* =====================================================
   UPDATE STATUS
===================================================== */

async function changeStatus(
  id,
  newStatus
){

  try{

    await updateDoc(

      doc(
        db,
        "orders",
        id
      ),

      {
        status:
          newStatus
      }

    );


    await loadOrders();

  }

  catch(error){

    console.error(error);


    alert(
      "❌ Status update नहीं हो पाया।"
    );

  }

}


/* =====================================================
   DATE CHANGE
===================================================== */

deliveryDate.addEventListener(
  "change",
  loadOrders
);


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
  "input",
  displayOrders
);


/* =====================================================
   REFRESH
===================================================== */

document
.getElementById(
  "refreshBtn"
)

/* =====================================================
   DAILY REPORT
===================================================== */

document
.getElementById(
  "printReportBtn"
)
.addEventListener(
  "click",
  ()=>{

    createReport();

    window.print();

  }
);


function createReport(){

  const date =
    deliveryDate.value;


  let jars = 0;

  let sales = 0;


  allOrders.forEach(
    order=>{

      jars +=
        Number(
          order.quantity
        ) || 0;


      sales +=
        Number(
          order.grandTotal
        ) || 0;

    }
  );


  document
  .getElementById(
    "reportDate"
  )
  .innerText =
    formatDate(date);


  document
  .getElementById(
    "reportOrders"
  )
  .innerText =
    allOrders.length;


  document
  .getElementById(
    "reportJars"
  )
  .innerText =
    jars;


  document
  .getElementById(
    "reportSales"
  )
  .innerText =
    sales.toFixed(2);


  const table =
    document
    .getElementById(
      "reportTable"
    );


  table.innerHTML =
    "";


  allOrders.forEach(
    order=>{

      const row =
        document.createElement(
          "tr"
        );


      row.innerHTML = `

        <td>
          ${safe(
            order.orderNumber ||
            order.id
          )}
        </td>

        <td>
          ${safe(
            order.name ||
            "-"
          )}
        </td>

        <td>
          ${safe(
            order.mobile ||
            "-"
          )}
        </td>

        <td>
          ${
            Number(
              order.quantity
            ) || 0
          }
        </td>

        <td>
          ₹${
            (
              Number(
                order.grandTotal
              ) || 0
            ).toFixed(2)
          }
        </td>

        <td>
          ${safe(
            order.status ||
            "Pending"
          )}
        </td>

      `;


      table.appendChild(
        row
      );

    }
  );

}

/* =====================================================
   FORMAT DATE
===================================================== */

function formatDate(
  date
){

  if(!date){
    return "-";
  }


  const parts =
    date.split("-");


  if(
    parts.length !== 3
  ){

    return date;

  }


  return (
    parts[2] +
    "-" +
    parts[1] +
    "-" +
    parts[0]
  );

}


/* =====================================================
   SAFE TEXT
===================================================== */

function safe(
  value
){

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}
