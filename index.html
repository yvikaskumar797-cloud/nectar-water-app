<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nectar Water App</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#4f7df3,#7650b8);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.app{
    width:390px;
    max-width:95%;
    min-height:700px;
    background:white;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
    position:relative;
}

.header{
    background:#4f70e8;
    color:white;
    text-align:center;
    padding:28px 15px;
}

.logo{
    width:105px;
    height:105px;
    border-radius:50%;
    background:white;
    padding:5px;
    margin:auto;
}

.logo img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
}

.header h1{
    margin:15px 0 5px;
    font-size:30px;
}

.header p{
    margin:0;
    font-size:16px;
}

.content{
    padding:25px 20px 90px;
    text-align:center;
    min-height:430px;
}

.content h2{
    font-size:26px;
    margin-top:0;
}

.card{
    background:#f2f5ff;
    padding:20px;
    border-radius:18px;
    margin:15px 0;
}

.card h3{
    margin:0 0 12px;
}

input, textarea, select{
    width:100%;
    padding:15px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
}

textarea{
    min-height:90px;
    resize:none;
}

button{
    width:100%;
    border:none;
    border-radius:12px;
    padding:15px;
    background:#5b73e8;
    color:white;
    font-size:17px;
    cursor:pointer;
    margin-top:8px;
}

button:hover{
    background:#405bd0;
}

.whatsapp{
    background:#25D366;
}

.call{
    background:#168cff;
}

.map{
    background:#ff7043;
}

.bottom{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    background:#f4f4f4;
    padding:10px;
    display:flex;
    gap:7px;
}

.bottom button{
    margin:0;
    font-size:14px;
    padding:14px 5px;
}

.message{
    font-weight:bold;
    margin-top:15px;
    line-height:1.6;
}
</style>
</head>

<body>

<div class="app">

<div class="header">

<div class="logo">
<img src="nectar-water.jpg" alt="Nectar Water Logo">
</div>

<h1>Nectar Water 💧</h1>
<p>Pure & Natural Drinking Water</p>

</div>


<div id="content" class="content">

<h2>Welcome 👋</h2>

<div class="card">

<h3>20 Liter Jar Home Delivery 🚚</h3>

<p>शुद्ध पानी, स्वस्थ जीवन।</p>

<button onclick="orderPage()">
🛒 Order Now
</button>

</div>

<div class="card">

<h3>RO + UV + Mineral Technology</h3>

<p>घर, दुकान, शादी-पार्टी और bulk supply के लिए संपर्क करें।</p>

</div>

</div>


<div class="bottom">

<button onclick="home()">🏠 Home</button>

<button onclick="orderPage()">🛒 Order</button>

<button onclick="contact()">📞 Contact</button>

<button onclick="locationPage()">📍 Map</button>

</div>

</div>


<script>

function home(){

document.getElementById("content").innerHTML = `

<h2>Welcome 👋</h2>

<div class="card">

<h3>Nectar Water 💧</h3>

<p>शुद्ध पानी, स्वस्थ जीवन।</p>

<p><b>20 Liter Jar Home Delivery 🚚</b></p>

<button onclick="orderPage()">
🛒 Order Now
</button>

</div>

<div class="card">

<h3>RO + UV + Mineral Technology</h3>

<p>घर, दुकान, शादी-पार्टी और bulk supply के लिए संपर्क करें।</p>

</div>

`;

}


function orderPage(){

document.getElementById("content").innerHTML = `

<h2>📦 Order Now</h2>

<div class="card">

<input id="customerName"
type="text"
placeholder="अपना नाम लिखें">

<input id="customerMobile"
type="tel"
placeholder="मोबाइल नंबर">

<select id="jarQuantity">

<option value="">Jar की संख्या चुनें</option>
<option value="1">1 Jar</option>
<option value="2">2 Jar</option>
<option value="5">5 Jar</option>
<option value="10">10 Jar</option>
<option value="20">20 Jar</option>
<option value="50">50 Jar</option>
<option value="100">100 Jar</option>

</select>

<textarea id="customerAddress"
placeholder="Delivery Address लिखें"></textarea>

<button class="whatsapp" onclick="placeOrder()">
📲 WhatsApp पर Order करें
</button>

</div>

<p id="orderMessage" class="message"></p>

`;

}


function placeOrder(){

let name =
document.getElementById("customerName").value.trim();

let mobile =
document.getElementById("customerMobile").value.trim();

let jars =
document.getElementById("jarQuantity").value;

let address =
document.getElementById("customerAddress").value.trim();


if(name === "" || mobile === "" || jars === "" || address === ""){

document.getElementById("orderMessage").innerText =
"⚠️ कृपया सभी जानकारी भरें।";

return;

}


let message =
"🌊 *NECTAR WATER ORDER*%0A%0A" +

"👤 नाम: " + encodeURIComponent(name) + "%0A" +

"📱 मोबाइल: " + encodeURIComponent(mobile) + "%0A" +

"🪣 Jar: " + encodeURIComponent(jars) + "%0A" +

"📍 पता: " + encodeURIComponent(address) + "%0A%0A" +

"धन्यवाद। Nectar Water 💧";


let whatsappURL =
"https://wa.me/918604970943?text=" + message;


window.open(whatsappURL, "_blank");

}


function contact(){

document.getElementById("content").innerHTML = `

<h2>📞 Contact Us</h2>

<div class="card">

<h3>Nectar Water 💧</h3>

<p><b>Vikash Kumar Yadav</b></p>

<p>📱 8604970943</p>

<p>📧 yvikaskumar797@gmail.com</p>

<p>📍 Jahanabad, District Fatehpur, U.P.</p>

<button class="call" onclick="callNow()">
📞 Call Now
</button>

<button class="whatsapp" onclick="whatsapp()">
📲 WhatsApp
</button>

<button onclick="email()">
📧 Send Email
</button>

</div>

`;

}


function callNow(){

window.location.href =
"tel:8604970943";

}


function whatsapp(){

window.open(
"https://wa.me/918604970943",
"_blank"
);

}


function email(){

window.location.href =
"mailto:yvikaskumar797@gmail.com";

}


function locationPage(){

let mapURL =
"https://www.google.com/maps/search/?api=1&query=" +
encodeURIComponent(
"Jahanabad, District Fatehpur, Uttar Pradesh"
);

window.open(mapURL,"_blank");

}

</script>

</body>
</html>
