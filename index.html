<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nectar Water - 20 Liter Jar</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#eef7ff;
    color:#172554;
}

.header{
    background:linear-gradient(135deg,#0878f9,#00a6ff);
    color:white;
    text-align:center;
    padding:28px 15px;
}

.logo{
    font-size:65px;
}

.header h1{
    font-size:32px;
    margin:5px 0;
}

.header p{
    font-size:17px;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:22px;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.price-box{
    text-align:center;
    background:#f0f9ff;
    border:2px solid #bae6fd;
}

.price-box h2{
    color:#0369a1;
    margin-bottom:8px;
}

.price{
    font-size:30px;
    font-weight:bold;
    color:#0284c7;
}

.capacity{
    text-align:center;
    background:#ecfdf5;
    border:2px solid #bbf7d0;
}

.capacity h3{
    color:#166534;
    margin-bottom:8px;
}

.capacity-number{
    font-size:26px;
    font-weight:bold;
    color:#15803d;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
    margin-top:15px;
}

input,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

input:focus,
textarea:focus{
    border-color:#0284c7;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.summary{
    background:#f8fafc;
    border-radius:14px;
    padding:16px;
    margin-top:20px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid #e2e8f0;
}

.summary-row:last-child{
    border-bottom:0;
}

.total{
    font-size:22px;
    font-weight:bold;
    color:#047857;
}

.order-btn{
    width:100%;
    padding:16px;
    margin-top:20px;
    border:0;
    border-radius:12px;
    background:linear-gradient(135deg,#16a34a,#059669);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.order-btn:disabled{
    background:#94a3b8;
    cursor:not-allowed;
}

.whatsapp-btn{
    width:100%;
    padding:15px;
    margin-top:12px;
    border:0;
    border-radius:12px;
    background:#25D366;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    display:none;
}

.message{
    display:none;
    padding:15px;
    margin-top:15px;
    border-radius:12px;
    text-align:center;
    font-weight:bold;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.info{
    background:#dbeafe;
    color:#1e40af;
}

.note{
    font-size:13px;
    color:#64748b;
    margin-top:6px;
}

.footer{
    text-align:center;
    padding:20px;
    color:#64748b;
    font-size:14px;
}

@media(max-width:500px){

    .header h1{
        font-size:27px;
    }

    .container{
        padding:12px;
    }

    .card{
        padding:18px;
    }

}
</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <div class="logo">💧</div>

    <h1>Nectar Water</h1>

    <p>शुद्ध पानी • आपके घर तक</p>

</div>


<div class="container">

    <!-- PRICE -->

    <div class="card price-box">

        <h2>💧 20 Liter Jar</h2>

        <div class="price">
            ₹20 प्रति Jar
        </div>

    </div>


    <!-- CAPACITY -->

    <div class="card capacity">

        <h3>
            📅 चुनी गई तारीख की उपलब्ध क्षमता
        </h3>

        <div
            id="capacityText"
            class="capacity-number">

            300 / 300 Jar बाकी

        </div>

    </div>


    <!-- ORDER FORM -->

    <div class="card">

        <h2>📝 Order करें</h2>


        <label for="name">
            👤 आपका नाम
        </label>

        <input
            id="name"
            type="text"
            placeholder="अपना नाम लिखें"
        >


        <label for="mobile">
            📱 मोबाइल नंबर
        </label>

        <input
            id="mobile"
            type="tel"
            maxlength="10"
            placeholder="10 अंकों का मोबाइल नंबर"
        >


        <label for="deliveryDate">
            📅 Delivery Date
        </label>

        <input
            id="deliveryDate"
            type="date"
        >


        <label for="quantity">
            🪣 कितने Jar चाहिए?
        </label>

        <input
            id="quantity"
            type="number"
            min="1"
            max="300"
            value="1"
            placeholder="Jar की संख्या"
        >

        <div class="note">
            अधिकतम 300 Jar प्रतिदिन
        </div>


        <label for="distance">
            📏 दूरी (KM)
        </label>

        <input
            id="distance"
            type="number"
            min="0"
            step="0.1"
            value="0"
            placeholder="जैसे 7"
        >


        <label for="address">
            📍 पूरा Address
        </label>

        <textarea
            id="address"
            placeholder="पूरा पता लिखें"
        ></textarea>


        <label for="extra">
            📝 Extra जानकारी (वैकल्पिक)
        </label>

        <textarea
            id="extra"
            placeholder="कोई अतिरिक्त जानकारी"
        ></textarea>


        <!-- SUMMARY -->

        <div class="summary">

            <div class="summary-row">

                <span>
                    🪣 Jar Amount
                </span>

                <strong id="jarAmount">
                    ₹20.00
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    🚚 Delivery Charge
                </span>

                <strong id="deliveryCharge">
                    ₹0.00
                </strong>

            </div>


            <div class="summary-row total">

                <span>
                    💰 Grand Total
                </span>

                <strong id="grandTotal">
                    ₹20.00
                </strong>

            </div>

        </div>


        <!-- ORDER BUTTON -->

        <button
            id="orderButton"
            class="order-btn">

            🪣 Order Confirm करें

        </button>


        <!-- WHATSAPP -->

        <button
            id="whatsappButton"
            class="whatsapp-btn">

            📱 WhatsApp पर Order भेजें

        </button>


        <div
            id="message"
            class="message">
        </div>

    </div>


    <div class="footer">

        © Nectar Water • 20 Liter Drinking Water

    </div>

</div>



<!-- FIREBASE -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc,
    runTransaction
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyC3qW2tnclJO65ziiptBAWxzifPoSLcKTw",

    authDomain:
    "nectar-water-e42b4.firebaseapp.com",

    projectId:
    "nectar-water",

    storageBucket:
    "nectar-water.firebasestorage.app",

    messagingSenderId:
    "292708650665",

    appId:
    "1:292708650665:web:f8ec60a21665e70867a3b8",

    measurementId:
    "G-P40N8EEDRC"
};


/* =========================
   INITIALIZE FIREBASE
========================= */

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


/* =========================
   WHATSAPP NUMBER
========================= */

const WHATSAPP_NUMBER =
    "918604970943";


/* =========================
   ELEMENTS
========================= */

const nameInput =
    document.getElementById("name");

const mobileInput =
    document.getElementById("mobile");

const dateInput =
    document.getElementById("deliveryDate");

const quantityInput =
    document.getElementById("quantity");

const distanceInput =
    document.getElementById("distance");

const addressInput =
    document.getElementById("address");

const extraInput =
    document.getElementById("extra");

const orderButton =
    document.getElementById("orderButton");

const whatsappButton =
    document.getElementById("whatsappButton");

const messageBox =
    document.getElementById("message");

const capacityText =
    document.getElementById("capacityText");

const jarAmountText =
    document.getElementById("jarAmount");

const deliveryChargeText =
    document.getElementById("deliveryCharge");

const grandTotalText =
    document.getElementById("grandTotal");


/* =========================
   TODAY DATE
========================= */

function getTodayDate(){

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            now.getDate()
        ).padStart(2,"0");

    return `${year}-${month}-${day}`;
}


/* =========================
   DEFAULT DATE
========================= */

dateInput.value =
    getTodayDate();

dateInput.min =
    getTodayDate();


/* =========================
   DELIVERY CALCULATION
========================= */

function calculateDelivery(){

    const quantity =
        Number(
            quantityInput.value
        ) || 0;

    const distance =
        Number(
            distanceInput.value
        ) || 0;


    const jarAmount =
        quantity * 20;


    let deliveryCharge = 0;


    /*
       30 से ज्यादा Jar:
       15 KM तक FREE
    */

    if(quantity >= 30){

        if(distance > 15){

            deliveryCharge =
                (distance - 15) * 7;

        }

        else{

            deliveryCharge = 0;

        }

    }

    /*
       1 से 29 Jar:
       5 KM तक FREE
       5-15 KM = ₹1.50 प्रति Jar
       15 KM से ऊपर = ₹7 प्रति KM
    */

    else{

        if(distance <= 5){

            deliveryCharge = 0;

        }

        else if(distance <= 15){

            deliveryCharge =
                quantity * 1.5;

        }

        else{

            deliveryCharge =
                quantity * 1.5 +
                (distance - 15) * 7;

        }

    }


    const grandTotal =
        jarAmount +
        deliveryCharge;


    jarAmountText.innerText =
        "₹" + jarAmount.toFixed(2);

    deliveryChargeText.innerText =
        "₹" + deliveryCharge.toFixed(2);

    grandTotalText.innerText =
        "₹" + grandTotal.toFixed(2);


    return {

        jarAmount,
        deliveryCharge,
        grandTotal

    };

}


/* =========================
   CALCULATION EVENTS
========================= */

quantityInput.addEventListener(
    "input",
    calculateDelivery
);

distanceInput.addEventListener(
    "input",
    calculateDelivery
);

calculateDelivery();


/* =========================
   LOAD DAILY CAPACITY
========================= */

async function loadCapacity(){

    const selectedDate =
        dateInput.value;


    if(!selectedDate){

        return;

    }


    try{

        const bookingRef =
            doc(
                db,
                "dailyBookings",
                selectedDate
            );


        const bookingSnap =
            await getDoc(
                bookingRef
            );


        let bookedJar = 0;


        if(
            bookingSnap.exists()
        ){

            bookedJar =
                Number(
                    bookingSnap
                    .data()
                    .bookedJar
                ) || 0;

        }


        const remaining =
            Math.max(
                0,
                300 - bookedJar
            );


        capacityText.innerText =
            `${remaining} / 300 Jar बाकी`;


        if(remaining === 0){

            capacityText.innerText =
                "❌ आज की Booking Full है";

            capacityText.style.color =
                "#dc2626";

        }

        else{

            capacityText.style.color =
                "#15803d";

        }

    }

    catch(error){

        console.error(
            "Capacity Error:",
            error
        );

    }

}


/* =========================
   DATE CHANGE
========================= */

dateInput.addEventListener(
    "change",
    function(){

        loadCapacity();

    }
);


/* =========================
   LOAD INITIAL CAPACITY
========================= */

loadCapacity();


/* =========================
   MESSAGE
========================= */

function showMessage(
    text,
    type
){

    messageBox.innerText =
        text;

    messageBox.className =
        "message " + type;

    messageBox.style.display =
        "block";

}


/* =========================
   VALIDATE FORM
========================= */

function validateForm(){

    const name =
        nameInput.value.trim();

    const mobile =
        mobileInput.value.trim();

    const deliveryDate =
        dateInput.value;

    const quantity =
        Number(
            quantityInput.value
        );

    const distance =
        Number(
            distanceInput.value
        );

    const address =
        addressInput.value.trim();


    if(!name){

        showMessage(
            "❌ कृपया अपना नाम डालें।",
            "error"
        );

        return false;

    }


    if(!/^[0-9]{10}$/.test(mobile)){

        showMessage(
            "❌ कृपया सही 10 अंकों का मोबाइल नंबर डालें।",
            "error"
        );

        return false;

    }


    if(!deliveryDate){

        showMessage(
            "❌ Delivery Date चुनें।",
            "error"
        );

        return false;

    }


    if(deliveryDate < getTodayDate()){

        showMessage(
            "❌ पिछली तारीख में Order नहीं किया जा सकता।",
            "error"
        );

        return false;

    }


    if(
        !Number.isInteger(quantity) ||
        quantity < 1 ||
        quantity > 300
    ){

        showMessage(
            "❌ Jar की संख्या 1 से 300 के बीच रखें।",
            "error"
        );

        return false;

    }


    if(
        isNaN(distance) ||
        distance < 0
    ){

        showMessage(
            "❌ दूरी सही डालें।",
            "error"
        );

        return false;

    }


    if(!address){

        showMessage(
            "❌ पूरा Address डालें।",
            "error"
        );

        return false;

    }


    return true;

}


/* =========================
   ORDER NUMBER
========================= */

function generateOrderNumber(){

    const year =
        new Date()
        .getFullYear();


    const random =
        Math.floor(
            10000000 +
            Math.random() * 90000000
        );


    return (
        "NW-" +
        year +
        "-" +
        random
    );

}


/* =========================
   FORMAT DATE
========================= */

function formatDate(date){

    const parts =
        date.split("-");


    if(parts.length !== 3){

        return date;

    }


    return (
        parts[2] +
        "-" +
        parts[1] +
        "-" +
        parts[0]
    );

}


/* =========================
   WHATSAPP MESSAGE
========================= */

function createWhatsAppMessage(
    order
){

    return `💧 *NECTAR WATER ORDER*

🆔 Order No: ${order.orderNumber}

👤 Name: ${order.name}

📱 Mobile: ${order.mobile}

📅 Delivery Date: ${formatDate(order.deliveryDate)}

🪣 Jar: ${order.quantity}

📏 Distance: ${order.distance} KM

🚚 Delivery Charge: ₹${order.deliveryCharge.toFixed(2)}

💰 Jar Amount: ₹${order.jarAmount.toFixed(2)}

💵 *Grand Total: ₹${order.grandTotal.toFixed(2)}*

📍 Address:
${order.address}

📝 Extra:
${order.extra || "कोई जानकारी नहीं"}

धन्यवाद।
*Nectar Water* 💧`;

}


/* =========================
   LAST ORDER
========================= */

let lastOrder = null;


/* =========================
   CREATE ORDER
========================= */

orderButton.addEventListener(
    "click",
    async function(){

        if(!validateForm()){

            return;

        }


        const name =
            nameInput.value.trim();

        const mobile =
            mobileInput.value.trim();

        const deliveryDate =
            dateInput.value;

        const quantity =
            Number(
                quantityInput.value
            );

        const distance =
            Number(
                distanceInput.value
            );

        const address =
            addressInput.value.trim();

        const extra =
            extraInput.value.trim();


        const amounts =
            calculateDelivery();


        const orderNumber =
            generateOrderNumber();


        orderButton.disabled =
            true;

        orderButton.innerText =
            "⏳ Order Save हो रहा है...";


        try{

            /*
               Daily booking document
               और order document को
               एक transaction में save किया जा रहा है।
            */

            const bookingRef =
                doc(
                    db,
                    "dailyBookings",
                    deliveryDate
                );


            const orderRef =
                doc(
                    db,
                    "orders",
                    orderNumber
                );


            await runTransaction(
                db,
                async function(transaction){

                    const bookingSnap =
                        await transaction.get(
                            bookingRef
                        );


                    let bookedJar = 0;


                    if(
                        bookingSnap.exists()
                    ){

                        bookedJar =
                            Number(
                                bookingSnap
                                .data()
                                .bookedJar
                            ) || 0;

                    }


                    const newTotal =
                        bookedJar +
                        quantity;


                    /*
                       300 Jar से ज्यादा
                       बिल्कुल allow नहीं
                    */

                    if(newTotal > 300){

                        throw new Error(
                            `BOOKING_FULL:${bookedJar}`
                        );

                    }


                    /*
                       Daily Booking Update
                    */

                    transaction.set(
                        bookingRef,
                        {

                            bookedJar:
                                newTotal,

                            lastOrderQuantity:
                                quantity,

                            updatedAt:
                                new Date()
                                .toISOString()

                        },
                        {
                            merge:true
                        }
                    );


                    /*
                       Order Save
                    */

                    transaction.set(
                        orderRef,
                        {

                            orderNumber:
                                orderNumber,

                            name:
                                name,

                            mobile:
                                mobile,

                            deliveryDate:
                                deliveryDate,

                            deliveryDateDisplay:
                                formatDate(
                                    deliveryDate
                                ),

                            quantity:
                                quantity,

                            distance:
                                distance,

                            address:
                                address,

                            extra:
                                extra,

                            jarPrice:
                                20,

                            jarAmount:
                                amounts.jarAmount,

                            deliveryCharge:
                                amounts.deliveryCharge,

                            grandTotal:
                                amounts.grandTotal,

                            status:
                                "Pending",

                            createdAt:
                                new Date()
                                .toISOString()

                        }
                    );

                }
            );


            /*
               Successful order
            */

            lastOrder = {

                orderNumber:
                    orderNumber,

                name:
                    name,

                mobile:
                    mobile,

                deliveryDate:
                    deliveryDate,

                quantity:
                    quantity,

                distance:
                    distance,

                address:
                    address,

                extra:
                    extra,

                jarAmount:
                    amounts.jarAmount,

                deliveryCharge:
                    amounts.deliveryCharge,

                grandTotal:
                    amounts.grandTotal

            };


            showMessage(
                `✅ Order सफलतापूर्वक दर्ज हो गया। Order No: ${orderNumber}`,
                "success"
            );


            orderButton.innerText =
                "✅ Order Saved";


            whatsappButton.style.display =
                "block";


            loadCapacity();


            /*
               Automatically WhatsApp
               खोलें
            */

            openWhatsApp();


        }

        catch(error){

            console.error(
                "Order Error:",
                error
            );


            if(
                error.message &&
                error.message.startsWith(
                    "BOOKING_FULL:"
                )
            ){

                const booked =
                    Number(
                        error.message
                        .split(":")[1]
                    ) || 0;


                const remaining =
                    Math.max(
                        0,
                        300 - booked
                    );


                showMessage(
                    `❌ इस तारीख में केवल ${remaining} Jar बाकी हैं।`,
                    "error"
                );


                capacityText.innerText =
                    `${remaining} / 300 Jar बाकी`;

            }

            else{

                showMessage(
                    "❌ Order save नहीं हो पाया। Internet और Firebase Rules check करें।",
                    "error"
                );

            }


            orderButton.disabled =
                false;

            orderButton.innerText =
                "🪣 Order Confirm करें";

        }

    }
);


/* =========================
   OPEN WHATSAPP
========================= */

function openWhatsApp(){

    if(!lastOrder){

        return;

    }


    const message =
        createWhatsAppMessage(
            lastOrder
        );


    const url =
        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        encodeURIComponent(
            message
        );


    window.open(
        url,
        "_blank"
    );

}


/* =========================
   WHATSAPP BUTTON
========================= */

whatsappButton.addEventListener(
    "click",
    function(){

        openWhatsApp();

    }
);


/* =========================
   MOBILE NUMBER ONLY
========================= */

mobileInput.addEventListener(
    "input",
    function(){

        this.value =
            this.value
            .replace(
                /[^0-9]/g,
                ""
            )
            .slice(
                0,
                10
            );

    }
);


/* =========================
   QUANTITY LIMIT
========================= */

quantityInput.addEventListener(
    "input",
    function(){

        let value =
            Number(
                this.value
            ) || 1;


        if(value < 1){

            value = 1;

        }


        if(value > 300){

            value = 300;

        }


        this.value =
            value;


        calculateDelivery();

    }
);

</script>

</body>
</html>
