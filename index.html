<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="theme-color" content="#08a9d4">

    <title>Nectar Water</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial,
                "Noto Sans Devanagari",
                sans-serif;

            background:
                linear-gradient(
                    180deg,
                    #dff8ff,
                    #f7fdff
                );

            color: #073b57;
        }

        .container {
            width: 100%;
            max-width: 560px;
            margin: auto;
            padding: 12px;
        }

        /* =====================
           HEADER
        ===================== */

        .header {
            background:
                linear-gradient(
                    135deg,
                    #079bd0,
                    #08b8d0
                );

            color: white;

            border-radius: 24px;

            padding: 25px 12px;

            text-align: center;

            box-shadow:
                0 8px 25px
                rgba(0,120,160,0.20);
        }

        .water-drop {
            font-size: 55px;
            line-height: 1;
            margin-bottom: 8px;
        }

        .header h1 {
            margin: 0;

            font-size:
                clamp(30px, 8vw, 44px);

            font-weight: 800;

            letter-spacing: 1px;
        }

        .tagline {
            margin-top: 9px;

            font-size: 18px;

            line-height: 1.5;
        }

        /*
           PRICE को हमेशा एक लाइन में रखने
           के लिए white-space nowrap
        */

        .price {
            margin-top: 16px;

            font-size:
                clamp(21px, 6vw, 31px);

            font-weight: 800;

            white-space: nowrap;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 5px;
        }


        /* =====================
           CARD
        ===================== */

        .card {
            background: white;

            margin-top: 15px;

            border-radius: 23px;

            padding: 19px 15px 26px;

            box-shadow:
                0 7px 24px
                rgba(0,90,120,0.12);
        }


        /* =====================
           CAPACITY
        ===================== */

        .capacity {
            background: #eefaff;

            border-radius: 17px;

            text-align: center;

            padding: 14px 8px;

            margin-bottom: 19px;

            font-size: 17px;

            font-weight: 700;

            line-height: 1.45;
        }

        .capacity strong {
            color: #007da9;

            font-size: 21px;
        }


        /* =====================
           FORM
        ===================== */

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;

            font-size: 17px;

            font-weight: 700;

            margin-bottom: 7px;

            color: #073b57;
        }

        input,
        textarea {
            width: 100%;

            border:
                1.5px solid #cbdce5;

            border-radius: 14px;

            padding: 14px;

            font-size: 17px;

            background: #fff;

            color: #173d4d;

            outline: none;

            -webkit-appearance: none;
        }

        input {
            min-height: 52px;
        }

        textarea {
            min-height: 90px;

            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #08a9d4;

            box-shadow:
                0 0 0 3px
                rgba(8,169,212,0.12);
        }


        /* =====================
           SUMMARY
        ===================== */

        .summary {
            margin-top: 7px;

            background: #f1fbff;

            border:
                1px solid #d4edf6;

            border-radius: 17px;

            padding: 15px;
        }

        .summary h2 {
            margin: 0 0 9px;

            font-size: 20px;
        }

        .row {
            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 12px;

            padding: 7px 0;

            font-size: 16px;
        }

        .row span:last-child {
            font-weight: 700;

            text-align: right;

            white-space: nowrap;
        }

        .total {
            border-top:
                1px solid #cce5ee;

            margin-top: 7px;

            padding-top: 12px;

            font-size: 21px;

            font-weight: 800;

            color: #0081ac;
        }


        /* =====================
           ORDER BUTTON
        ===================== */

        .order-btn {
            width: 100%;

            border: none;

            border-radius: 16px;

            padding: 16px;

            margin-top: 18px;

            background:
                linear-gradient(
                    135deg,
                    #079bd0,
                    #08b6c8
                );

            color: white;

            font-size: 20px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 7px 18px
                rgba(0,150,190,0.25);
        }

        .order-btn:active {
            transform: scale(0.98);
        }

        .order-btn:disabled {
            background: #9bb3bc;

            cursor: not-allowed;

            box-shadow: none;
        }


        /* =====================
           SUCCESS
        ===================== */

        .success {
            display: none;

            margin-top: 17px;

            background: #eafbf0;

            border:
                1px solid #a9e4bd;

            color: #126b35;

            padding: 17px;

            border-radius: 16px;

            text-align: center;

            font-size: 17px;

            line-height: 1.6;
        }

        .success h3 {
            margin: 0 0 6px;

            font-size: 22px;
        }


        /* =====================
           FOOTER
        ===================== */

        footer {
            text-align: center;

            padding: 20px 10px 30px;

            color: #52717e;

            font-size: 14px;

            line-height: 1.6;
        }


        /* =====================
           SMALL MOBILE
        ===================== */

        @media (max-width: 380px) {

            .container {
                padding: 8px;
            }

            .header {
                border-radius: 20px;

                padding:
                    22px 8px;
            }

            .water-drop {
                font-size: 50px;
            }

            .header h1 {
                font-size: 28px;
            }

            .tagline {
                font-size: 16px;
            }

            .price {
                font-size: 20px;

                gap: 3px;
            }

            .card {
                border-radius: 20px;

                padding:
                    17px 12px 23px;
            }

            label {
                font-size: 16px;
            }

            input,
            textarea {
                font-size: 16px;
            }

            .total {
                font-size: 20px;
            }
        }

    </style>
</head>


<body>

<div class="container">


    <!-- =====================
         HEADER
    ====================== -->

    <header class="header">

        <div class="water-drop">
            💧
        </div>

        <h1>
            NECTAR WATER
        </h1>

        <div class="tagline">
            राधे राधे 🙏<br>
            शुद्ध पानी • आपके घर तक
        </div>

        <div class="price">
            💧 20 Liter Jar • ₹20 प्रति Jar
        </div>

    </header>


    <!-- =====================
         ORDER CARD
    ====================== -->

    <main class="card">


        <!-- CAPACITY -->

        <div class="capacity">

            📅 चुनी गई तारीख की उपलब्ध क्षमता:

            <br>

            <strong>
                <span id="availableJars">
                    300
                </span>

                / 300 Jar बाकी
            </strong>

        </div>


        <!-- =====================
             FORM
        ====================== -->

        <div class="field">

            <label>
                👤 आपका नाम
            </label>

            <input
                type="text"
                id="name"
                placeholder="अपना नाम लिखें"
                autocomplete="name"
            >

        </div>


        <div class="field">

            <label>
                📱 मोबाइल नंबर
            </label>

            <input
                type="tel"
                id="mobile"
                placeholder="10 अंकों का मोबाइल नंबर"
                maxlength="10"
                inputmode="numeric"
                autocomplete="tel"
            >

        </div>


        <div class="field">

            <label>
                📅 Delivery Date
            </label>

            <input
                type="date"
                id="deliveryDate"
            >

        </div>


        <div class="field">

            <label>
                🪣 कितने Jar चाहिए?
            </label>

            <input
                type="number"
                id="quantity"
                value="1"
                min="1"
                max="300"
                inputmode="numeric"
            >

        </div>


        <div class="field">

            <label>
                📏 दूरी (KM)
            </label>

            <input
                type="number"
                id="distance"
                value="0"
                min="0"
                step="0.1"
                inputmode="decimal"
            >

        </div>


        <div class="field">

            <label>
                📍 पूरा Address
            </label>

            <textarea
                id="address"
                placeholder="अपना पूरा पता लिखें"
            ></textarea>

        </div>


        <!-- =====================
             ORDER SUMMARY
        ====================== -->

        <div class="summary">

            <h2>
                🧾 Order Summary
            </h2>


            <div class="row">

                <span>
                    Jar Price
                </span>

                <span id="jarPrice">
                    ₹20 × 1
                </span>

            </div>


            <div class="row">

                <span>
                    Water Amount
                </span>

                <span id="waterAmount">
                    ₹20
                </span>

            </div>


            <div class="row">

                <span>
                    Delivery Charge
                </span>

                <span id="deliveryCharge">
                    ₹0
                </span>

            </div>


            <div class="row total">

                <span>
                    कुल राशि
                </span>

                <span id="totalAmount">
                    ₹20
                </span>

            </div>

        </div>


        <!-- =====================
             ORDER BUTTON
        ====================== -->

        <button
            class="order-btn"
            id="orderBtn"
            onclick="placeOrder()"
        >
            🛒 Order करें
        </button>


        <!-- =====================
             SUCCESS
        ====================== -->

        <div
            class="success"
            id="successBox"
        >

            <h3>
                ✅ Order सफल हुआ!
            </h3>

            <div id="successText"></div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        Nectar Water
        <br>

        शुद्ध पानी • आपके घर तक

    </footer>

</div>


<script>


/* ==========================
   DATE
========================== */

const dateInput =
    document.getElementById(
        "deliveryDate"
    );


const today =
    new Date();


const year =
    today.getFullYear();


const month =
    String(
        today.getMonth() + 1
    ).padStart(2, "0");


const day =
    String(
        today.getDate()
    ).padStart(2, "0");


const todayString =
    `${year}-${month}-${day}`;


dateInput.value =
    todayString;


dateInput.min =
    todayString;



/* ==========================
   ELEMENTS
========================== */

const quantityInput =
    document.getElementById(
        "quantity"
    );


const distanceInput =
    document.getElementById(
        "distance"
    );



/* ==========================
   CALCULATE TOTAL
========================== */

function calculateTotal() {

    let quantity =
        parseInt(
            quantityInput.value
        ) || 0;


    let distance =
        parseFloat(
            distanceInput.value
        ) || 0;


    const jarPrice =
        20;


    const waterAmount =
        quantity * jarPrice;


    let deliveryCharge =
        0;


    /*
       DELIVERY RULE

       1-29 Jar:
       5 KM तक FREE
       5-15 KM = ₹1.50 प्रति Jar

       30 से ज्यादा Jar:
       15 KM तक FREE

       15 KM से ज्यादा:
       अतिरिक्त दूरी = ₹7/KM
    */


    if (quantity > 30) {

        if (distance > 15) {

            deliveryCharge =
                Math.ceil(
                    distance - 15
                ) * 7;

        }

    } else {

        if (
            distance > 5 &&
            distance <= 15
        ) {

            deliveryCharge =
                quantity * 1.5;

        }

        else if (
            distance > 15
        ) {

            deliveryCharge =
                quantity * 1.5;

            deliveryCharge +=
                Math.ceil(
                    distance - 15
                ) * 7;

        }

    }


    const total =
        waterAmount +
        deliveryCharge;


    document.getElementById(
        "jarPrice"
    ).textContent =
        `₹20 × ${quantity}`;


    document.getElementById(
        "waterAmount"
    ).textContent =
        `₹${waterAmount}`;


    document.getElementById(
        "deliveryCharge"
    ).textContent =
        `₹${deliveryCharge}`;


    document.getElementById(
        "totalAmount"
    ).textContent =
        `₹${total}`;


    return {

        quantity,

        distance,

        waterAmount,

        deliveryCharge,

        total

    };

}



/* ==========================
   LIVE CALCULATION
========================== */

quantityInput.addEventListener(
    "input",
    calculateTotal
);


distanceInput.addEventListener(
    "input",
    calculateTotal
);


calculateTotal();



/* ==========================
   ORDER
========================== */

function placeOrder() {


    const name =
        document
        .getElementById("name")
        .value
        .trim();


    const mobile =
        document
        .getElementById("mobile")
        .value
        .trim();


    const date =
        document
        .getElementById("deliveryDate")
        .value;


    const address =
        document
        .getElementById("address")
        .value
        .trim();


    const result =
        calculateTotal();



    /* NAME */

    if (!name) {

        alert(
            "कृपया अपना नाम लिखें।"
        );

        return;
    }



    /* MOBILE */

    if (
        !/^[6-9][0-9]{9}$/
        .test(mobile)
    ) {

        alert(
            "कृपया सही 10 अंकों का मोबाइल नंबर डालें।"
        );

        return;
    }



    /* DATE */

    if (!date) {

        alert(
            "कृपया Delivery Date चुनें।"
        );

        return;
    }



    /* QUANTITY */

    if (
        result.quantity < 1 ||
        result.quantity > 300
    ) {

        alert(
            "Jar की संख्या 1 से 300 के बीच होनी चाहिए।"
        );

        return;
    }



    /* ADDRESS */

    if (!address) {

        alert(
            "कृपया अपना पूरा Address लिखें।"
        );

        return;
    }



    /* SUCCESS */

    const successBox =
        document.getElementById(
            "successBox"
        );


    const successText =
        document.getElementById(
            "successText"
        );


    successText.innerHTML =

        `धन्यवाद <b>${escapeHtml(name)}</b>!<br>
        आपके लिए <b>${result.quantity} Jar</b> का Order दर्ज किया गया है।<br>
        Delivery Date: <b>${formatDate(date)}</b><br>
        कुल राशि: <b>₹${result.total}</b>`;


    successBox.style.display =
        "block";


    successBox.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });

}



/* ==========================
   DATE FORMAT
========================== */

function formatDate(
    dateString
) {

    const parts =
        dateString.split("-");


    return `${parts[2]}/${parts[1]}/${parts[0]}`;

}



/* ==========================
   SECURITY
========================== */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;

}


</script>

</body>
</html>
