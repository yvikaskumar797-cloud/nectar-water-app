<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nectar Water - Admin Panel</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f1f5f9;
    color:#1e293b;
}

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(135deg,#4776f5,#764ba2);
}

.login-box{
    width:100%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:22px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
    text-align:center;
    font-size:55px;
    margin-bottom:10px;
}

.login-box h1{
    text-align:center;
    margin-bottom:8px;
}

.login-box p{
    text-align:center;
    color:#64748b;
    margin-bottom:22px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:14px;
}

input,
select{
    width:100%;
    padding:13px;
    margin-top:7px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    font-size:16px;
}

button{
    border:0;
    cursor:pointer;
}

.login-btn{
    width:100%;
    margin-top:20px;
    padding:14px;
    border-radius:10px;
    background:#4776f5;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    display:none;
    text-align:center;
    font-weight:bold;
}

.error{
    background:#fee2e2;
    color:#b91c1c;
}

.success{
    background:#dcfce7;
    color:#15803d;
}

#adminPage{
    display:none;
}

.header{
    background:linear-gradient(135deg,#4776f5,#5d6ee8);
    color:white;
    padding:20px;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.header h1{
    font-size:25px;
}

.logout{
    background:white;
    color:#4776f5;
    padding:10px 16px;
    border-radius:9px;
    font-weight:bold;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.filter-box{
    background:white;
    padding:18px;
    border-radius:16px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.filter-row{
    display:flex;
    gap:12px;
    align-items:end;
}

.filter-item{
    flex:1;
}

.filter-item label{
    margin-top:0;
}

.refresh{
    padding:13px 20px;
    background:#4776f5;
    color:white;
    border-radius:10px;
    font-weight:bold;
}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:white;
    padding:20px;
    border-radius:16px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.stat-title{
    color:#64748b;
    font-size:14px;
}

.stat-value{
    font-size:28px;
    font-weight:bold;
    margin-top:8px;
}

.limit{
    color:#4776f5;
}

.orders{
    display:grid;
    gap:15px;
}

.order{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.order-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.order-number{
    font-size:18px;
    font-weight:bold;
}

.status{
    padding:7px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.pending{
    background:#fef3c7;
    color:#92400e;
}

.delivered{
    background:#dcfce7;
    color:#166534;
}

.order-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.detail{
    background:#f8fafc;
    padding:10px;
    border-radius:8px;
}

.detail b{
    display:block;
    margin-bottom:4px;
}

.actions{
    margin-top:15px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.action-btn{
    padding:10px 14px;
    border-radius:8px;
    color:white;
    font-weight:bold;
}

.call-btn{
    background:#1683d8;
}

.whatsapp-btn{
    background:#25D366;
}

.deliver-btn{
    background:#16a34a;
}

.pending-btn{
    background:#f59e0b;
}

.empty{
    background:white;
    padding:35px;
    text-align:center;
    border-radius:16px;
    color:#64748b;
}

.loading{
    text-align:center;
    padding:25px;
    color:#64748b;
}

@media(max-width:700px){

    .cards{
        grid-template-columns:1fr;
    }

    .filter-row{
        flex-direction:column;
        align-items:stretch;
    }

    .order-grid{
        grid-template-columns:1fr;
    }

    .header-inner{
        align-items:flex-start;
    }

}
</style>
</head>

<body>


<!-- =========================
     LOGIN PAGE
========================= -->

<div id="loginPage" class="login-page">

    <div class="login-box">

        <div class="logo">💧</div>

        <h1>Nectar Water</h1>

        <p>Admin Panel Login</p>


        <label>
            📧 Email
        </label>

        <input
            id="email"
            type="email"
            placeholder="Admin Email"
            autocomplete="username"
        >


        <label>
            🔒 Password
        </label>

        <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
        >


        <button
            id="loginButton"
            class="login-btn">

            🔐 Login

        </button>


        <div
            id="loginMessage"
            class="message">
        </div>

    </div>

</div>



<!-- =========================
     ADMIN PAGE
========================= -->

<div id="adminPage">

    <div class="header">

        <div class="header-inner">

            <div>
                <h1>💧 Nectar Water Admin</h1>
                <div id="adminEmail"></div>
            </div>

            <button
                id="logoutButton"
                class="logout">

                🚪 Logout

            </button>

        </div>

    </div>


    <div class="container">


        <!-- FILTER -->

        <div class="filter-box">

            <div class="filter-row">

                <div class="filter-item">

                    <label>
                        📅 Delivery Date
                    </label>

                    <input
                        id="filterDate"
                        type="date"
                    >

                </div>


                <div class="filter-item">

                    <label>
                        🔎 Search Order / Mobile / Name
                    </label>

                    <input
                        id="searchBox"
                        type="text"
                        placeholder="Search..."
                    >

                </div>


                <button
                    id="refreshButton"
                    class="refresh">

                    🔄 Refresh

                </button>

            </div>

        </div>


        <!-- STATS -->

        <div class="cards">

            <div class="stat">

                <div class="stat-title">
                    🪣 Booked Jar
                </div>

                <div
                    id="bookedJar"
                    class="stat-value limit">

                    0 / 300

                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    📦 Total Orders
                </div>

                <div
                    id="totalOrders"
                    class="stat-value">

                    0

                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    💰 Total Sales
                </div>

                <div
                    id="totalSales"
                    class="stat-value">

                    ₹0

                </div>

            </div>

        </div>


        <!-- ORDERS -->

        <div
            id="orders"
            class="orders">

            <div class="loading">
                ⏳ Orders load हो रहे हैं...
            </div>

        </div>

    </div>

</div>



<!-- =========================
     FIREBASE
========================= -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    doc,
    updateDoc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyC3qW2tnclJO65ziiptBAWxzifPoSLcKTw",

    authDomain:
    "nectar-water-e42b4.firebaseapp.com",

    projectId:
    "nectar-water",

    storageBucket:
    "nectar-water.firebasestorage.app",

    messagingSenderId:
    "292708650665",

    appId:
    "1:292708650665:web:f8ec60a21665e70867a3b8",

    measurementId:
    "G-P40N8EEDRC"
};


/* =========================
   INITIALIZE
========================= */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =========================
   ELEMENTS
========================= */

const loginPage =
    document.getElementById(
        "loginPage"
    );

const adminPage =
    document.getElementById(
        "adminPage"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const logoutButton =
    document.getElementById(
        "logoutButton"
    );

const loginMessage =
    document.getElementById(
        "loginMessage"
    );

const adminEmail =
    document.getElementById(
        "adminEmail"
    );

const filterDate =
    document.getElementById(
        "filterDate"
    );

const searchBox =
    document.getElementById(
        "searchBox"
    );

const ordersBox =
    document.getElementById(
        "orders"
    );


/* =========================
   TODAY DATE
========================= */

function getTodayDate(){

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth()+1
        ).padStart(2,"0");

    const day =
        String(
            now.getDate()
        ).padStart(2,"0");

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );
}


/* =========================
   SET DATE
========================= */

filterDate.value =
    getTodayDate();


/* =========================
   LOGIN
========================= */

loginButton.addEventListener(
    "click",
    async function(){

        const email =
            document
            .getElementById("email")
            .value
            .trim();

        const password =
            document
            .getElementById("password")
            .value;


        if(!email || !password){

            showLoginMessage(
                "Email और Password दोनों डालें।",
                false
            );

            return;
        }


        loginButton.disabled =
            true;

        loginButton.innerText =
            "⏳ Login हो रहा है...";


        try{

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        }

        catch(error){

            console.error(error);

            showLoginMessage(
                getLoginError(error),
                false
            );

            loginButton.disabled =
                false;

            loginButton.innerText =
                "🔐 Login";

        }

    }
);


/* =========================
   ENTER KEY LOGIN
========================= */

document
.getElementById("password")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            loginButton.click();

        }

    }
);


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
    auth,
    function(user){

        if(user){

            loginPage.style.display =
                "none";

            adminPage.style.display =
                "block";

            adminEmail.innerText =
                user.email || "";

            loadOrders();

        }

        else{

            loginPage.style.display =
                "flex";

            adminPage.style.display =
                "none";

        }

    }
);


/* =========================
   LOGOUT
========================= */

logoutButton.addEventListener(
    "click",
    async function(){

        await signOut(auth);

    }
);


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

    ordersBox.innerHTML =
        '<div class="loading">⏳ Orders load हो रहे हैं...</div>';


    const selectedDate =
        filterDate.value;


    if(!selectedDate){

        ordersBox.innerHTML =
            '<div class="empty">📅 Delivery Date चुनें।</div>';

        return;
    }


    try{

        /*
           Orders collection में
           selected deliveryDate के
           orders खोजे जाएंगे.
        */

        const ordersRef =
            collection(
                db,
                "orders"
            );


        const ordersQuery =
            query(
                ordersRef,
                where(
                    "deliveryDate",
                    "==",
                    selectedDate
                )
            );


        const snapshot =
            await getDocs(
                ordersQuery
            );


        let orders = [];


        snapshot.forEach(
            function(docSnap){

                orders.push({

                    id:
                        docSnap.id,

                    ...docSnap.data()

                });

            }
        );


        /*
           Newest first
        */

        orders.sort(
            function(a,b){

                return (
                    String(
                        b.orderNumber || ""
                    )
                    .localeCompare(
                        String(
                            a.orderNumber || ""
                        )
                    )
                );

            }
        );


        window.currentOrders =
            orders;


        renderOrders();


        await loadDailyStats(
            selectedDate
        );

    }

    catch(error){

        console.error(
            "Load Orders Error:",
            error
        );


        ordersBox.innerHTML =
            '<div class="empty">❌ Orders load नहीं हो पाए। Firestore Rules check करें।</div>';

    }

}


/* =========================
   DAILY STATS
========================= */

async function loadDailyStats(date){

    try{

        const bookingRef =
            doc(
                db,
                "dailyBookings",
                date
            );


        const bookingSnap =
            await getDoc(
                bookingRef
            );


        let booked =
            0;


        if(
            bookingSnap.exists()
        ){

            booked =
                Number(
                    bookingSnap
                    .data()
                    .bookedJar
                ) || 0;

        }


        const orders =
            window.currentOrders ||
            [];


        let sales =
            0;


        orders.forEach(
            function(order){

                sales +=
                    Number(
                        order.grandTotal
                    ) || 0;

            }
        );


        document
        .getElementById(
            "bookedJar"
        )
        .innerText =
            booked +
            " / 300";


        document
        .getElementById(
            "totalOrders"
        )
        .innerText =
            orders.length;


        document
        .getElementById(
            "totalSales"
        )
        .innerText =
            "₹" +
            sales.toFixed(2);

    }

    catch(error){

        console.error(
            error
        );

    }

}


/* =========================
   RENDER ORDERS
========================= */

function renderOrders(){

    let orders =
        window.currentOrders ||
        [];


    const search =
        searchBox
        .value
        .trim()
        .toLowerCase();


    if(search){

        orders =
            orders.filter(
                function(order){

                    const text =

                        String(
                            order.orderNumber || ""
                        ) +
                        " " +

                        String(
                            order.name || ""
                        ) +
                        " " +

                        String(
                            order.mobile || ""
                        ) +
                        " " +

                        String(
                            order.address || ""
                        );


                    return text
                        .toLowerCase()
                        .includes(search);

                }
            );

    }


    if(orders.length === 0){

        ordersBox.innerHTML =
            '<div class="empty">📭 इस तारीख के लिए कोई order नहीं मिला।</div>';

        return;
    }


    ordersBox.innerHTML =
        "";


    orders.forEach(
        function(order){

            const status =
                order.status ||
                "Pending";


            const isDelivered =
                status ===
                "Delivered";


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "order";


            card.innerHTML = `

                <div class="order-head">

                    <div class="order-number">

                        🆔 ${escapeHtml(
                            order.orderNumber || "-"
                        )}

                    </div>

                    <div class="status ${
                        isDelivered
                        ? "delivered"
                        : "pending"
                    }">

                        ${
                            isDelivered
                            ? "🟢 Delivered"
                            : "🟡 Pending"
                        }

                    </div>

                </div>


                <div class="order-grid">

                    <div class="detail">

                        <b>👤 Customer</b>

                        ${escapeHtml(
                            order.name || "-"
                        )}

                    </div>


                    <div class="detail">

                        <b>📱 Mobile</b>

                        ${escapeHtml(
                            order.mobile || "-"
                        )}

                    </div>


                    <div class="detail">

                        <b>📅 Delivery Date</b>

                        ${escapeHtml(
                            order.deliveryDateDisplay ||
                            order.deliveryDate ||
                            "-"
                        )}

                    </div>


                    <div class="detail">

                        <b>🪣 Jar</b>

                        ${Number(
                            order.quantity || 0
                        )}

                    </div>


                    <div class="detail">

                        <b>📍 Distance</b>

                        ${Number(
                            order.distance || 0
                        )} KM

                    </div>


                    <div class="detail">

                        <b>🚚 Delivery Charge</b>

                        ₹${Number(
                            order.deliveryCharge || 0
                        ).toFixed(2)}

                    </div>


                    <div class="detail">

                        <b>💰 Jar Amount</b>

                        ₹${Number(
                            order.jarAmount || 0
                        ).toFixed(2)}

                    </div>


                    <div class="detail">

                        <b>💵 Grand Total</b>

                        ₹${Number(
                            order.grandTotal || 0
                        ).toFixed(2)}

                    </div>


                    <div
                        class="detail"
                        style="grid-column:1/-1">

                        <b>📍 Address</b>

                        ${escapeHtml(
                            order.address || "-"
                        )}

                    </div>


                    <div
                        class="detail"
                        style="grid-column:1/-1">

                        <b>📝 Extra Information</b>

                        ${escapeHtml(
                            order.extra || "कोई नहीं"
                        )}

                    </div>

                </div>


                <div class="actions">

                    <a
                        class="action-btn call-btn"
                        href="tel:${escapeHtml(
                            order.mobile || ""
                        )}">

                        📞 Call

                    </a>


                    <a
                        class="action-btn whatsapp-btn"
                        target="_blank"
                        href="https://wa.me/91${escapeHtml(
                            order.mobile || ""
                        )}?text=${encodeURIComponent(
                            "Nectar Water Order " +
                            (order.orderNumber || "") +
                            " के संबंध में संपर्क कर रहे हैं।"
                        )}">

                        📱 WhatsApp

                    </a>


                    <button
                        class="action-btn ${
                            isDelivered
                            ? "pending-btn"
                            : "deliver-btn"
                        }"
                        onclick="changeStatus(
                            '${escapeHtml(order.id)}',
                            '${isDelivered ? "Pending" : "Delivered"}'
                        )">

                        ${
                            isDelivered
                            ? "↩️ Pending करें"
                            : "✅ Delivered करें"
                        }

                    </button>

                </div>

            `;


            ordersBox.appendChild(
                card
            );

        }
    );


    document
    .getElementById(
        "totalOrders"
    )
    .innerText =
        orders.length;

}


/* =========================
   CHANGE STATUS
========================= */

window.changeStatus =
async function(
    orderId,
    newStatus
){

    try{

        await updateDoc(
            doc(
                db,
                "orders",
                orderId
            ),
            {
                status:
                    newStatus
            }
        );


        await loadOrders();

    }

    catch(error){

        console.error(
            error
        );

        alert(
            "Status update नहीं हो पाया।"
        );

    }

};


/* =========================
   SEARCH
========================= */

searchBox.addEventListener(
    "input",
    function(){

        renderOrders();

    }
);


/* =========================
   DATE CHANGE
========================= */

filterDate.addEventListener(
    "change",
    function(){

        loadOrders();

    }
);


/* =========================
   REFRESH
========================= */

document
.getElementById(
    "refreshButton"
)
.addEventListener(
    "click",
    function(){

        loadOrders();

    }
);


/* =========================
   LOGIN MESSAGE
========================= */

function showLoginMessage(
    text,
    success
){

    loginMessage.innerText =
        text;

    loginMessage.className =
        "message " +
        (
            success
            ? "success"
            : "error"
        );

    loginMessage.style.display =
        "block";

}


/* =========================
   LOGIN ERRORS
========================= */

function getLoginError(error){

    if(
        error.code ===
        "auth/invalid-credential"
    ){

        return "❌ Email या Password गलत है।";

    }


    if(
        error.code ===
        "auth/user-not-found"
    ){

        return "❌ यह Admin account मौजूद नहीं है।";

    }


    if(
        error.code ===
        "auth/wrong-password"
    ){

        return "❌ Password गलत है।";

    }


    if(
        error.code ===
        "auth/too-many-requests"
    ){

        return "⚠️ बहुत अधिक प्रयास हुए हैं। कुछ देर बाद प्रयास करें।";

    }


    if(
        error.code ===
        "auth/operation-not-allowed"
    ){

        return "⚠️ Firebase में Email/Password Login Enable करें।";

    }


    return (
        "❌ Login Error: " +
        error.message
    );

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

</script>

</body>
</html>
