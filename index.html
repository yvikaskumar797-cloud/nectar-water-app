<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc,
    runTransaction,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================
   FIREBASE CONFIG
===================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyC3qW2tnclJO65ziiptBAWxzifPoSLcKTw",

    authDomain:
    "nectar-water-e42b4.firebaseapp.com",

    projectId:
    "nectar-water",

    storageBucket:
    "nectar-water.firebasestorage.app",

    messagingSenderId:
    "292708650665",

    appId:
    "1:292708650665:web:f8ec60a21665e70867a3b8",

    measurementId:
    "G-P40N8EEDRC"
};


/* =====================================
   FIREBASE INITIALIZE
===================================== */

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


/* =====================================
   SETTINGS
===================================== */

const JAR_PRICE = 20;

const DAILY_LIMIT = 300;


/*
   Nectar Water WhatsApp Number
*/

const BUSINESS_WHATSAPP =
    "918604970943";


/* =====================================
   ELEMENTS
===================================== */

const nameInput =
    document.getElementById("name");

const mobileInput =
    document.getElementById("mobile");

const dateInput =
    document.getElementById("deliveryDate");

const quantityInput =
    document.getElementById("quantity");

const distanceInput =
    document.getElementById("distance");

const addressInput =
    document.getElementById("address");

const extraInput =
    document.getElementById("extra");

const bookingButton =
    document.getElementById("bookingButton");

const messageBox =
    document.getElementById("message");

const availableJar =
    document.getElementById("availableJar");

const jarAmountBox =
    document.getElementById("jarAmount");

const deliveryChargeBox =
    document.getElementById("deliveryCharge");

const grandTotalBox =
    document.getElementById("grandTotal");

const whatsappButton =
    document.getElementById("whatsappButton");


/* =====================================
   TODAY DATE
===================================== */

function getTodayDate(){

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            now.getDate()
        ).padStart(2,"0");

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );
}


/* =====================================
   FORMAT DATE
===================================== */

function formatDate(date){

    if(!date){
        return "";
    }

    const parts =
        date.split("-");

    if(parts.length !== 3){
        return date;
    }

    return (
        parts[2] +
        "-" +
        parts[1] +
        "-" +
        parts[0]
    );
}


/* =====================================
   SET DATE
===================================== */

dateInput.min =
    getTodayDate();

dateInput.value =
    getTodayDate();


/* =====================================
   DELIVERY CHARGE
=====================================

1-29 Jar:
0-5 KM = FREE
5-15 KM = ₹1.50 per Jar

30+ Jar:
15 KM तक = FREE

15 KM से अधिक:
₹7 per KM

===================================== */

function calculateDeliveryCharge(
    quantity,
    distance
){

    quantity =
        Number(quantity) || 0;

    distance =
        Number(distance) || 0;


    if(quantity <= 0){
        return 0;
    }


    /*
       30 या अधिक Jar
       15 KM तक FREE
    */

    if(
        quantity >= 30 &&
        distance <= 15
    ){

        return 0;

    }


    /*
       1 से 29 Jar
       5 KM से अधिक
       और 15 KM तक
       ₹1.50 प्रति Jar
    */

    if(
        quantity >= 1 &&
        quantity <= 29 &&
        distance > 5 &&
        distance <= 15
    ){

        return quantity * 1.5;

    }


    /*
       15 KM से अधिक
       ₹7 प्रति KM
    */

    if(distance > 15){

        return distance * 7;

    }


    return 0;
}


/* =====================================
   UPDATE TOTAL
===================================== */

function updateTotal(){

    const quantity =
        Number(
            quantityInput.value
        ) || 0;

    const distance =
        Number(
            distanceInput.value
        ) || 0;


    const jarAmount =
        quantity * JAR_PRICE;


    const deliveryCharge =
        calculateDeliveryCharge(
            quantity,
            distance
        );


    const grandTotal =
        jarAmount +
        deliveryCharge;


    jarAmountBox.innerText =
        "₹" +
        jarAmount.toFixed(2);


    deliveryChargeBox.innerText =
        "₹" +
        deliveryCharge.toFixed(2);


    grandTotalBox.innerText =
        "₹" +
        grandTotal.toFixed(2);
}


quantityInput.addEventListener(
    "input",
    updateTotal
);

distanceInput.addEventListener(
    "input",
    updateTotal
);


/* =====================================
   SHOW MESSAGE
===================================== */

function showMessage(
    text,
    type
){

    messageBox.innerText =
        text;

    messageBox.className =
        "message " + type;

    messageBox.style.display =
        "block";
}


/* =====================================
   CHECK DAILY JAR
===================================== */

async function checkAvailableJars(){

    const date =
        dateInput.value;


    if(!date){

        availableJar.innerText =
            "पहले तारीख चुनें";

        return 300;
    }


    try{

        const bookingRef =
            doc(
                db,
                "dailyBookings",
                date
            );


        const snapshot =
            await getDoc(
                bookingRef
            );


        let bookedJar =
            0;


        if(snapshot.exists()){

            bookedJar =
                Number(
                    snapshot.data().bookedJar
                ) || 0;

        }


        const remaining =
            Math.max(
                0,
                DAILY_LIMIT - bookedJar
            );


        availableJar.innerText =
            remaining +
            " / " +
            DAILY_LIMIT +
            " Jar बाकी";


        if(remaining <= 0){

            availableJar.style.color =
                "#dc2626";

            bookingButton.disabled =
                true;

            bookingButton.innerText =
                "❌ इस तारीख की Booking Full है";

        }
        else{

            availableJar.style.color =
                "#15803d";

            bookingButton.disabled =
                false;

            bookingButton.innerText =
                "🛒 Order Book करें";

        }


        return remaining;

    }

    catch(error){

        console.error(
            "Availability Error:",
            error
        );


        availableJar.innerText =
            "⚠️ उपलब्धता check नहीं हो सकी";


        /*
           Firebase error में booking
           को सुरक्षित रखने के लिए
           button बंद रहेगा.
        */

        bookingButton.disabled =
            true;

        bookingButton.innerText =
            "⚠️ Firebase Connection Check करें";


        return null;

    }
}


/* =====================================
   DATE CHANGE
===================================== */

dateInput.addEventListener(
    "change",
    async function(){

        whatsappButton.style.display =
            "none";

        await checkAvailableJars();

    }
);


/* =====================================
   MOBILE VALIDATION
===================================== */

function validMobile(mobile){

    return /^[6-9]\d{9}$/.test(
        mobile
    );

}


/* =====================================
   ORDER NUMBER
===================================== */

function createOrderNumber(){

    const year =
        new Date()
        .getFullYear();


    const random =
        Math.floor(
            10000000 +
            Math.random() *
            90000000
        );


    return (
        "NW-" +
        year +
        "-" +
        random
    );

}


/* =====================================
   BOOK ORDER
===================================== */

bookingButton.addEventListener(
    "click",
    async function(){

        whatsappButton.style.display =
            "none";


        const name =
            nameInput.value.trim();

        const mobile =
            mobileInput.value.trim();

        const deliveryDate =
            dateInput.value;

        const quantity =
            Number(
                quantityInput.value
            );

        const distance =
            Number(
                distanceInput.value
            ) || 0;

        const address =
            addressInput.value.trim();

        const extra =
            extraInput.value.trim();


        /* ================================
           VALIDATION
        ================================= */

        if(!name){

            showMessage(
                "❌ कृपया नाम डालें।",
                "error"
            );

            return;
        }


        if(!validMobile(mobile)){

            showMessage(
                "❌ सही 10 अंकों का मोबाइल नंबर डालें।",
                "error"
            );

            return;
        }


        if(!deliveryDate){

            showMessage(
                "❌ Delivery Date चुनें।",
                "error"
            );

            return;
        }


        if(
            deliveryDate <
            getTodayDate()
        ){

            showMessage(
                "❌ पुरानी तारीख की Booking नहीं हो सकती।",
                "error"
            );

            return;
        }


        if(
            !quantity ||
            quantity < 1
        ){

            showMessage(
                "❌ कम से कम 1 Jar चुनें।",
                "error"
            );

            return;
        }


        if(
            quantity >
            DAILY_LIMIT
        ){

            showMessage(
                "❌ एक order में अधिकतम 300 Jar हो सकते हैं।",
                "error"
            );

            return;
        }


        if(
            distance < 0
        ){

            showMessage(
                "❌ Distance सही डालें।",
                "error"
            );

            return;
        }


        if(!address){

            showMessage(
                "❌ कृपया पूरा Address डालें।",
                "error"
            );

            return;
        }


        /* ================================
           DISABLE BUTTON
        ================================= */

        bookingButton.disabled =
            true;

        bookingButton.innerText =
            "⏳ Booking हो रही है...";


        try{

            /*
               Daily booking document
            */

            const bookingRef =
                doc(
                    db,
                    "dailyBookings",
                    deliveryDate
                );


            /*
               Unique order document
            */

            const orderRef =
                doc(
                    db,
                    "orders",
                    crypto.randomUUID()
                );


            const orderNumber =
                createOrderNumber();


            const jarAmount =
                quantity *
                JAR_PRICE;


            const deliveryCharge =
                calculateDeliveryCharge(
                    quantity,
                    distance
                );


            const grandTotal =
                jarAmount +
                deliveryCharge;


            /* ================================
               FIRESTORE TRANSACTION
            ================================= */

            await runTransaction(
                db,
                async function(transaction){

                    const bookingSnap =
                        await transaction.get(
                            bookingRef
                        );


                    let bookedJar =
                        0;


                    if(
                        bookingSnap.exists()
                    ){

                        bookedJar =
                            Number(
                                bookingSnap
                                .data()
                                .bookedJar
                            ) || 0;

                    }


                    const newTotal =
                        bookedJar +
                        quantity;


                    /*
                       HARD 300 LIMIT
                    */

                    if(
                        newTotal >
                        DAILY_LIMIT
                    ){

                        throw new Error(
                            "LIMIT_REACHED"
                        );

                    }


                    /*
                       Daily booking update
                    */

                    transaction.set(
                        bookingRef,
                        {

                            bookedJar:
                                newTotal,

                            lastOrderQuantity:
                                quantity,

                            updatedAt:
                                serverTimestamp()

                        },
                        {
                            merge:true
                        }
                    );


                    /*
                       Order save
                    */

                    transaction.set(
                        orderRef,
                        {

                            orderNumber:
                                orderNumber,

                            name:
                                name,

                            mobile:
                                mobile,

                            quantity:
                                quantity,

                            jarPrice:
                                JAR_PRICE,

                            distance:
                                distance,

                            deliveryCharge:
                                deliveryCharge,

                            jarAmount:
                                jarAmount,

                            grandTotal:
                                grandTotal,

                            deliveryDate:
                                deliveryDate,

                            deliveryDateDisplay:
                                formatDate(
                                    deliveryDate
                                ),

                            address:
                                address,

                            extra:
                                extra,

                            status:
                                "Pending",

                            createdAt:
                                serverTimestamp()

                        }
                    );

                }
            );


            /* ================================
               SUCCESS
            ================================= */

            showMessage(
                "✅ आपका Order सफलतापूर्वक Book हो गया। Order No: " +
                orderNumber,
                "success"
            );


            /*
               WhatsApp message
            */

            const whatsappText =

                "💧 Nectar Water Order\n\n" +

                "🆔 Order No: " +
                orderNumber +
                "\n" +

                "👤 Name: " +
                name +
                "\n" +

                "📱 Mobile: " +
                mobile +
                "\n" +

                "📅 Delivery Date: " +
                formatDate(
                    deliveryDate
                ) +
                "\n" +

                "🪣 Jar: " +
                quantity +
                "\n" +

                "📍 Distance: " +
                distance +
                " KM\n" +

                "🚚 Delivery Charge: ₹" +
                deliveryCharge.toFixed(2) +
                "\n" +

                "💰 Jar Amount: ₹" +
                jarAmount.toFixed(2) +
                "\n" +

                "💵 Grand Total: ₹" +
                grandTotal.toFixed(2) +
                "\n\n" +

                "📍 Address: " +
                address +
                "\n" +

                "📝 Extra: " +
                (
                    extra ||
                    "कोई जानकारी नहीं"
                );


            /*
               WhatsApp business number:
               8604970943
            */

            whatsappButton.href =
                "https://wa.me/" +
                BUSINESS_WHATSAPP +
                "?text=" +
                encodeURIComponent(
                    whatsappText
                );


            whatsappButton.style.display =
                "block";


            bookingButton.innerText =
                "✅ Booking Complete";


            /*
               Refresh available jars
            */

            await checkAvailableJars();


        }

        catch(error){

            console.error(
                "BOOKING ERROR:",
                error
            );


            if(
                error.message ===
                "LIMIT_REACHED"
            ){

                showMessage(
                    "❌ इस तारीख पर 300 Jar की limit पूरी हो चुकी है। कृपया दूसरी तारीख चुनें।",
                    "error"
                );

            }
            else{

                showMessage(
                    "❌ Booking नहीं हो पाई। Firebase connection या Rules check करें।",
                    "error"
                );

            }


            bookingButton.disabled =
                false;

            bookingButton.innerText =
                "🛒 Order Book करें";

        }

    }
);


/* =====================================
   INITIAL LOAD
===================================== */

updateTotal();

checkAvailableJars();

</script>
