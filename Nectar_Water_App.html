<title>Nectar Water</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.app{width:390px;max-width:100%;min-height:680px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 15px 40px rgba(0,0,0,.25)}
.header{background:linear-gradient(135deg,#4f7cff,#5f6eea);color:#fff;text-align:center;padding:25px 20px 22px}
.logo{width:105px;height:105px;border-radius:50%;background:#fff;margin:0 auto 12px;padding:4px;overflow:hidden;border:3px solid #fff}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.header h1{margin:8px 0 5px;font-size:30px}
.header p{margin:0;font-size:15px}
.content{padding:24px 20px;min-height:395px;text-align:center}
h2{margin-top:0;font-size:25px}
.card{background:#f5f7ff;border-radius:18px;padding:18px;margin:14px 0}
input,select{width:100%;padding:14px;border:1px solid #d5d8e5;border-radius:12px;font-size:16px;margin:7px 0}
button{border:0;border-radius:12px;padding:13px 12px;background:#5d73e8;color:#fff;font-size:16px;cursor:pointer;margin-top:9px}
button:active{transform:scale(.98)}
.primary{width:100%}
.success{background:#eafaf0;padding:14px;border-radius:14px;margin-top:15px;font-weight:bold}
.menu{display:flex;gap:7px;padding:10px;background:#f1f3f8}
.menu button{flex:1;margin:0;font-size:12px;padding:12px 5px}
.contact-btn{width:100%}
.small{font-size:13px;color:#666}
.order-title{font-size:20px;font-weight:bold;margin-bottom:8px}
.price{font-size:24px;font-weight:bold;margin:8px 0}
</style>

<script>
function home() {
  document.getElementById("content").innerHTML = `
    <h2>🏠 Home</h2>
    <div class="card">
      <div class="order-title">Nectar Water 💧</div>
      <p>शुद्ध पानी, स्वस्थ जीवन।</p>
      <p><b>20 Liter Jar Home Delivery 🚚</b></p>
      <button class="primary" onclick="orderNow()">🛒 Order Now</button>
    </div>
    <div class="card">
      <p><b>RO + UV + Mineral Technology</b></p>
      <p class="small">शादी, पार्टी, दुकान और bulk supply उपलब्ध।</p>
    </div>
  `;
}

function orderNow() {
  document.getElementById("content").innerHTML = `
    <h2>🛒 Order Now</h2>
    <div class="card">
      <label>20 Liter Jar</label>
      <select id="qty">
        <option value="1">1 Jar</option>
        <option value="2">2 Jars</option>
        <option value="5">5 Jars</option>
        <option value="10">10 Jars</option>
        <option value="20">20 Jars</option>
      </select>
      <input id="customerName" type="text" placeholder="आपका नाम">
      <input id="customerAddress" type="text" placeholder="Delivery Address">
      <button class="primary" onclick="sendOrder()">💬 WhatsApp पर Order भेजें</button>
      <p class="small">Order भेजने के बाद आपको WhatsApp में message मिलेगा।</p>
    </div>
  `;
}

function sendOrder() {
  const name = document.getElementById("customerName").value.trim();
  const address = document.getElementById("customerAddress").value.trim();
  const qty = document.getElementById("qty").value;

  if (!name || !address) {
    alert("कृपया नाम और Delivery Address भरें।");
    return;
  }

  const message =
    "Nectar Water Order%0A" +
    "नाम: " + encodeURIComponent(name) + "%0A" +
    "20 Liter Jar: " + encodeURIComponent(qty) + "%0A" +
    "Delivery Address: " + encodeURIComponent(address);

  window.open("https://wa.me/918604970943?text=" + message, "_blank");
}

function contact() {
  document.getElementById("content").innerHTML = `
    <h2>📞 Contact Us</h2>
    <div class="card">
      <p><b>Vikash Kumar Yadav</b></p>
      <button class="contact-btn" onclick="callNow()">📞 Call Now</button>
      <button class="contact-btn" onclick="whatsapp()">💬 WhatsApp</button>
      <button class="contact-btn" onclick="email()">📧 Email</button>
      <button class="contact-btn" onclick="address()">📍 Address</button>
    </div>
  `;
}

function callNow() {
  window.location.href = "tel:8604970943";
}

function whatsapp() {
  window.open("https://wa.me/918604970943", "_blank");
}

function email() {
  window.location.href = "mailto:yvikaskumar797@gmail.com";
}

function address() {
  const url = "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent("Jahanabad, District Fatehpur, Uttar Pradesh");
  window.open(url, "_blank");
}
